<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ben_sacks | Election Polls &amp; Sampling Distributions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..900;1,8..60,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#1e1e1e; --panel:#232323; --ink:#e9e9e9; --muted:#a0a0a0; --line:#3d3d3d; --soft:#2c2c2c;
  --blue:#4a8cff; --blueEdge:#a9ccff; --red:#ff5a4f;
  --acc:#e3b505; --accSoft:rgba(227,181,5,.38); --accHot:rgba(227,181,5,.22); --accInk:#f2cc3a; --onAcc:#1e1e1e;
  --ok:#3ddc84; --bad:#ff6b6b;
  --shadow:none;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f3f1ea; --panel:#ffffff; --ink:#1e1e1e; --muted:#5f5f5f; --line:#d6d3c8; --soft:#eceae1;
  --blue:#1565e0; --blueEdge:#0b419a; --red:#d93025;
  --acc:#d9a800; --accSoft:rgba(217,168,0,.38); --accHot:rgba(217,168,0,.26); --accInk:#6b5200; --onAcc:#1e1e1e;
  --ok:#0b7f44; --bad:#c62828;
  --shadow:0 1px 2px rgba(20,25,40,.05),0 6px 18px rgba(20,25,40,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--serif);font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);
  font-size:clamp(15px,.8vw + 5px,21px);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
.cr{color:var(--red);font-weight:800}
.cb{color:var(--blue);font-weight:800}

/* top bar */
header.top{display:flex;align-items:center;gap:.6em;padding:.45em .9em;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;white-space:nowrap;font-size:1.02em;display:flex;align-items:center;gap:.4em}
.brand svg{width:1.3em;height:1.3em}
nav.tabs{display:flex;gap:.2em;overflow-x:auto;flex:1 1 300px;min-width:0;scrollbar-width:thin;padding:.1em 0}
.tab{border:0;background:transparent;padding:.35em .7em;border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted);font-size:.86em;font-family:var(--mono)}
.tab b{font-weight:800;margin-right:.3em;opacity:.55}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--acc);color:var(--onAcc)}
.tab.on b{opacity:.8}
.tools{display:flex;align-items:center;gap:.4em;font-size:.82em}
.kbd{font-size:.72em;color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.btn{border:1px solid var(--line);background:var(--panel);padding:.38em .8em;border-radius:10px;cursor:pointer;font-weight:600;line-height:1.2;font-family:var(--mono)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:transparent;border-color:var(--acc);color:var(--acc)}
.btn.primary:hover:not(:disabled){background:var(--accHot)}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.dot:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* stage */
.stage{overflow:auto;padding:1.2em 1.2em 1em;min-height:0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:1em 1.4em;align-items:start}
.col{display:flex;flex-direction:column;gap:.7em;min-width:0}

/* story cards */
.ln{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.6em .9em .7em;box-shadow:var(--shadow);opacity:.78}
.ln.now{opacity:1;border-color:var(--acc);box-shadow:0 0 0 3px var(--accHot),var(--shadow)}
.anim .ln.now{animation:rise .35s ease}
.ln .cap{font:700 .72em var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.35em}
.ln p{margin:.3em 0}
.eq{margin:.45em 0;padding:.35em .7em;background:var(--soft);border-radius:10px;overflow-x:auto;overflow-y:hidden;font-size:1.02em}
.eq .katex-display{margin:.15em 0}
.katex{font-size:1.08em;text-transform:none}
.fo{text-align:center;color:var(--ink);font-size:13px;line-height:1.2}
.cv.sortable canvas{cursor:pointer}
.cd{font-family:var(--mono);font-weight:700;font-size:.82em}
.note{color:var(--muted);font-size:.92em;margin:.35em 0}
.note b{color:var(--ink)}
.tag{background:var(--accHot);border-bottom:2px solid var(--acc);padding:.02em .35em;border-radius:7px;font-weight:700}
.rem{border-left:4px solid var(--acc);background:var(--accHot);padding:.4em .7em;border-radius:0 10px 10px 0;font-weight:600;font-size:.94em;margin:.45em 0 .1em}
.ans{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:2px solid var(--ok);border-radius:14px;padding:.4em .9em;font-weight:800;font-size:1.08em;margin-top:.5em}
.ans small{display:block;font-weight:600;font-size:.72em;color:var(--muted)}
.chk{list-style:none;padding:0;margin:.4em 0}
.chk li{display:flex;gap:.6em;margin:.3em 0}
.chk li::before{content:"\2713";color:var(--ok);font-weight:900}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* viz panel */
.viz{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.vcap{padding:.5em .9em;border-bottom:1px solid var(--line);font:700 .76em var(--mono);letter-spacing:.03em;color:var(--accInk);display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap}
.vcap span:last-child{color:var(--muted);text-transform:none}
.vbody{padding:.8em .9em;min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:.4em .5em;align-items:center;padding:.6em .9em;border-top:1px solid var(--line)}
.ctl .lab{font:700 .74em var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:.1em}
.ctl .sp{flex:1}
.sl{display:flex;align-items:center;gap:.5em;flex:1 1 15em;min-width:0}
.sl input{flex:1;min-width:6em;accent-color:var(--acc)}
.sl b{font:700 .8em var(--mono);min-width:5.2em;color:var(--accInk)}
.ctl .btn{font-size:.82em}
.readout{font:700 .84em var(--mono);color:var(--ink);display:flex;flex-wrap:wrap;gap:.3em 1.1em}
.readout b{color:var(--accInk)}
.readout .bl{color:var(--blue)} .readout .rd{color:var(--red)}

/* population + poll box */
.popwrap{display:flex;gap:1em;align-items:flex-start;flex-wrap:wrap}
.cv{position:relative;flex:1 1 260px;max-width:min(100%,60vh);aspect-ratio:1}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.qmark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.qmark span{background:var(--panel);border:2px solid var(--acc);color:var(--accInk);border-radius:12px;padding:.25em .8em;font:700 1.5em var(--mono)}
.side{flex:0 0 9.5em;display:flex;flex-direction:column;gap:.7em;min-width:8em}
.side h4{margin:0 0 .3em;font:700 .72em var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pbox{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;aspect-ratio:1;max-width:9.5em}
.pbox i{border-radius:2px;display:block}
.pbox i.b{background:var(--blue)} .pbox i.r{background:var(--red)}
.legend{display:flex;flex-direction:column;gap:.25em;font:700 .76em var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.45em;vertical-align:-.05em}
.chips{display:flex;flex-wrap:wrap;gap:.3em}
.chip{font:700 .74em var(--mono);padding:.12em .55em;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chip.last{border-color:var(--acc);color:var(--accInk);background:var(--accHot)}

/* svg charts */
.chart{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--ink);stroke-width:1.4}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{font:700 11px var(--mono);fill:var(--muted);text-anchor:middle}
.chart .at{font:700 11px var(--mono);fill:var(--muted);text-anchor:middle}
.chart .mk{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4}
.chart .ml{font:700 11px var(--mono);fill:var(--ink);text-anchor:middle}
.chart .bar{fill:var(--blue);opacity:.82}
.chart .bar.hot{fill:var(--acc);opacity:1}
.chart .curve{fill:none;stroke:var(--ink);stroke-width:2.2}
.chart .area{fill:var(--accHot);stroke:none}
.chart .cap{stroke:var(--acc);stroke-width:2}
.chart .hit{stroke:var(--muted);stroke-width:1.6;opacity:.8}
.chart .miss{stroke:var(--acc);stroke-width:2.6}
.chart .pd{fill:var(--blue)}
.chart .pd.miss{fill:var(--acc)}

/* sample-size bars + summary */
.nbars{display:flex;flex-direction:column;gap:.5em}
.nb{display:grid;grid-template-columns:4.2em minmax(0,1fr) 4.5em;gap:.6em;align-items:center;font:700 .84em var(--mono);cursor:pointer;border:1px solid transparent;border-radius:8px;padding:.15em .3em;background:transparent;text-align:left}
.nb:hover{border-color:var(--line)}
.nb.on{border-color:var(--acc);background:var(--accHot)}
.nb .trk{height:1.1em;background:var(--soft);border-radius:4px;overflow:hidden}
.nb .fil{display:block;height:100%;background:var(--blue);min-width:3px}
.nb .v{text-align:right;color:var(--accInk)}
table.sum{border-collapse:collapse;width:100%;font-size:.95em}
table.sum td{padding:.5em .6em;border-bottom:1px solid var(--line);vertical-align:top}
table.sum td:first-child{font:700 .8em var(--mono);color:var(--accInk);white-space:nowrap;width:1%}

/* prompts, answers, checks */
.ask{margin:.6em 0 .2em;border:1.5px dashed var(--acc);border-radius:12px;padding:.5em .75em .6em;background:var(--accHot)}
.aq{display:flex;gap:.6em;align-items:flex-start;font-weight:700}
.ai{flex:none;width:1.55em;height:1.55em;border-radius:50%;background:var(--acc);color:var(--onAcc);display:grid;place-items:center;font:800 .78em var(--mono);margin-top:.1em}
.ask>.btn,.qb>.btn{margin-top:.5em;font-size:.8em}
.aa{margin-top:.5em;padding:.35em .75em .45em;border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel));border-radius:0 10px 10px 0;font-weight:500}
.aa p{margin:.25em 0}
.anim .aa{animation:rise .3s ease}
.ln.check{border-color:var(--blue)}
.ln.check .cap{color:var(--blue)}
.qa{display:flex;gap:.65em;margin:.6em 0}
.qn{flex:none;width:1.65em;height:1.65em;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 .8em var(--mono);margin-top:.1em}
.qb{flex:1;min-width:0}
.chart .mid{fill:color-mix(in srgb,var(--blue) 26%,transparent);stroke:none}
.chart .tail{fill:var(--acc);opacity:.7;stroke:none}
.chart .ruler{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 4}
.chart .bigl{font:800 14px var(--mono);fill:var(--ink);text-anchor:middle}
.chart .pq{fill:none;stroke:var(--ink);stroke-width:2.2}
table.zt{border-collapse:collapse;width:100%;font:700 .72em var(--mono);text-align:center;margin-top:.6em}
table.zt th,table.zt td{padding:.28em .1em;border:1px solid var(--line)}
table.zt th{color:var(--muted);background:var(--soft)}
table.zt td{color:var(--ink)}
table.zt .hh{background:var(--accHot);color:var(--accInk)}
table.zt td.hi{background:var(--acc);color:var(--onAcc)}
.zcap{font:700 .72em var(--mono);color:var(--muted);margin-top:.5em}

/* nav bar */
footer.navbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8em;align-items:center;padding:.55em 1em;background:var(--panel);border-top:1px solid var(--line)}
.mid{display:flex;flex-direction:column;align-items:center;gap:.3em;min-width:0}
.slabel{font:700 .82em var(--mono);color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.dots{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;max-width:100%}
.dot{width:.7em;height:.7em;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.past{background:var(--muted)}
.dot.cur{background:var(--acc);transform:scale(1.4)}
.dot.chk{border-radius:2px;transform:rotate(45deg)}
.dot.chk.cur{transform:rotate(45deg) scale(1.4)}
.nbtn{font-size:1.02em;padding:.55em 1.1em;border-radius:12px}

@media (min-width:901px){
  .stage{overflow:hidden;display:flex;flex-direction:column;padding-bottom:.8em}
  .stage>.duo{flex:1 1 0;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
  .duo>.col{min-height:0;overflow-y:auto;overflow-x:hidden;padding:.2em .3em .6em .2em}
}
@media (max-width:900px){
  .duo{grid-template-columns:minmax(0,1fr)}
  .kbd{display:none}
  .ln:not(.now){display:none}
  .col.right{order:2}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>

    <nav class="tabs" id="tabs" aria-label="Chapters"></nav>

  </footer>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);

/* ---------- the election ---------- */
const N=10000, TARGET=5400, COLS=100;       // 10,000 voters, 54% will vote Blue
const f2=x=>x.toFixed(2), f3=x=>x.toFixed(3), f4=x=>x.toFixed(4);
const raw=String.raw;
function tex(s,disp){ try{ return window.katex?katex.renderToString(s,{displayMode:!!disp,throwOnError:false}):s; }catch(e){ return s; } }
const T=s=>tex(s), PH=tex('\\hat p');            // p-hat
const Rd='<span class="cr">Red</span>', Bl='<span class="cb">Blue</span>';

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pop=new Uint8Array(N);                 // 1 = votes Blue
for(let i=0;i<TARGET;i++) pop[i]=1;
{ const r=mulberry(119); for(let i=N-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=pop[i]; pop[i]=pop[j]; pop[j]=t; } }

const NBLUE=pop.reduce((a,b)=>a+b,0), P=NBLUE/N;   // p is computed from the voters, not typed in
const sortedOrder=Uint16Array.from({length:N},(_,i)=>i).sort((a,b)=>pop[b]-pop[a]||a-b);   // Blue first

/* ---------- math ---------- */
function Phi(z){ const t=1/(1+0.2316419*Math.abs(z)); const d=0.3989422804014327*Math.exp(-z*z/2);
  const p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429)))); return z>0?1-p:p; }
const seOf=(p,n)=>Math.sqrt(p*(1-p)/n);
const Z={0.8:1.281552,0.9:1.644854,0.95:1.959964,0.99:2.575829};
const pctTxt=l=>Math.round(l*100)+'%';
function binomK(n){ let k=0; for(let i=0;i<n;i++) if(Math.random()<P) k++; return k; }

/* ---------- simulation of many polls ---------- */
const binIdx=(k,n)=> n<100 ? k : Math.round(k*100/n);
const binW=n=> n<100 ? 1/n : 0.01;
const binCtr=(m,n)=> n<100 ? m/n : m/100;
function mkSim(n){ return {n,bins:new Array(n<100?n+1:101).fill(0),total:0,sum:0,sumsq:0}; }
function simAdd(s,count){ for(let i=0;i<count;i++){ const k=binomK(s.n); s.bins[binIdx(k,s.n)]++; s.total++; s.sum+=k; s.sumsq+=k*k; } }
const simMean=s=>s.sum/s.total/s.n;
const simSD=s=>Math.sqrt(Math.max(0,s.sumsq/s.total-Math.pow(s.sum/s.total,2)))/s.n;

/* ---------- state ---------- */
const st={g:0,theme:'dark',anim:true,sorted:false};
let one={cur:null,first:null,hist:[]};                         // chapter 2: single polls on the population
let sim=mkSim(100);                                 // chapter 3: stacking polls
let big=null;                                       // chapter 4: 10,000 polls of n = 100
const prob={dir:'le',c:0.5,n:100};                        // chapter 4: "try it"
const ci={n:100,level:0.95,single:null,tally:{n:0,hit:0},zs:null,run:[]};   // zs: fixed random draws behind the 100 polls
const ss={level:0.95,me:0.03};
const zs={level:0.95};                              // chapter 5: z* explorer
const rv={};                                        // which "show answer" boxes are open
let view={mode:'grey',mask:null};

function bigSim(){ if(!big){ big=mkSim(100); simAdd(big,10000); } return big; }

/* ---------- single poll on the population ---------- */
function takePoll(){
  const idx=new Uint16Array(N); for(let i=0;i<N;i++) idx[i]=i;
  const mask=new Uint8Array(N); let k=0;
  for(let i=0;i<100;i++){ const j=i+Math.floor(Math.random()*(N-i)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; mask[idx[i]]=1; k+=pop[idx[i]]; }
  one.cur={mask,k}; if(!one.first) one.first=one.cur; one.hist.push(k/100);
}

/* ---------- confidence-interval polls ---------- */
function invPhi(p){   // inverse normal CDF (Acklam), used for z* at any confidence level
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425; let q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
const zOf=level=>invPhi(1-(1-level)/2);
const randn=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const posToN=v=>Math.round(25*Math.pow(40,v/1000)), nToPos=n=>Math.round(1000*Math.log(n/25)/Math.log(40));   // log slider, 25 to 1,000
function mkCI(k,n){ const ph=k/n, se=seOf(ph,n), me=Z[0.95]*se;
  return {k,n,ph,se,me,lo:ph-me,hi:ph+me,hit:(ph-me<=P && P<=ph+me)}; }
function newSingle(){ ci.single=mkCI(binomK(100),100); if(rv.c5cap){ ci.tally.n++; if(ci.single.hit) ci.tally.hit++; } }
function newZs(){ ci.zs=Array.from({length:100},randn); }

  return ci.zs.map(z=>{ const ph=Math.min(.99,Math.max(.01,P+sd*z)), se=seOf(ph,ci.n), me=zc*se;
    return {ph,se,me,lo:ph-me,hi:ph+me,hit:(ph-me<=P && P<=ph+me)}; }); }

function drawPop(){

  g.globalAlpha=1;

/* ---------- viz: histogram of p-hat ---------- */
const AX0=0.2, AX1=0.9;
function histSVG(o){
  const W=640,H=330,L=14,R=14,T=26,B=46, pw=W-L-R, ph=H-T-B;
  const n=o.sim.n, bw=binW(n), total=o.sim.total, bins=o.sim.bins;
  const X=x=>L+(x-AX0)/(AX1-AX0)*pw, base=T+ph;
  const barPx=bw/(AX1-AX0)*pw;
  const maxC=Math.max(1,...bins);
  const mu=o.curve?o.curve.mu:0, sd=o.curve?o.curve.sd:0;
  const peak=o.curve&&total?total*bw/(sd*Math.sqrt(2*Math.PI)):0;
  const u=Math.min(barPx*.95,ph/(Math.max(maxC,peak)*1.1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of sample proportions">`;
  for(let x=0.2;x<=0.9001;x+=0.1){ s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+16}">${x.toFixed(1)}</text>`; }
  if(o.areaRange&&o.curve){ const [a,b]=o.areaRange; const lo=Math.max(a,AX0), hi=Math.min(b,AX1); let d=`M${X(lo)},${base}`;
    for(let i=0;i<=80;i++){ const x=lo+(hi-lo)*i/80; const y=total*bw*Math.exp(-0.5*Math.pow((x-mu)/sd,2))/(sd*Math.sqrt(2*Math.PI)); d+=`L${X(x)},${base-y*u}`; }
    s+=`<path class="area" d="${d}L${X(hi)},${base}Z"/>`; }
  bins.forEach((c,m)=>{ if(!c) return; const ctr=binCtr(m,n); const x=X(ctr)-barPx/2; const hot=o.shade&&o.shade(ctr);
    const w=Math.max(1,barPx-1.4);
    if(u>=4){ for(let j=0;j<c;j++) s+=`<rect class="bar${hot?' hot':''}" x="${x+.7}" y="${base-(j+1)*u+.6}" width="${w}" height="${u-1.2}" rx="1.5"/>`; }
    else s+=`<rect class="bar${hot?' hot':''}" x="${x+.7}" y="${base-c*u}" width="${w}" height="${c*u}"/>`; });
  if(o.curve&&total){ let d=''; for(let i=0;i<=140;i++){ const x=AX0+(AX1-AX0)*i/140; const y=total*bw*Math.exp(-0.5*Math.pow((x-mu)/sd,2))/(sd*Math.sqrt(2*Math.PI)); d+=(i?'L':'M')+X(x)+','+(base-y*u); }
    s+=`<path class="curve" d="${d}"/>`; }
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  (o.marks||[]).forEach(m=>{ s+=`<line class="mk" x1="${X(m.x)}" x2="${X(m.x)}" y1="${T-4}" y2="${base}"/><text class="ml" x="${X(m.x)}" y="${T-9}">${m.label}</text>`; });
  s+=`<text class="at" x="${W/2}" y="${H-6}">share of Blue in each poll (sample proportion)</text></svg>`;
  return s;
}

/* ---------- viz: confidence-interval charts ---------- */
const CX0=0.2, CX1=0.9;
function ciAxis(W,L,R,top,base){ const X=x=>L+(Math.min(CX1,Math.max(CX0,x))-CX0)/(CX1-CX0)*(W-L-R); let s='';
  for(let x=CX0;x<=CX1+.0001;x+=0.1) s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${top}" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+16}">${x.toFixed(1)}</text>`;
  return {X,s}; }
function singleSVG(c,reveal,ptOnly){
  const W=640,H=200,L=14,R=14,base=150; const {X,s:ax}=ciAxis(W,L,R,30,base);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="One poll and its interval">${ax}<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  if(reveal) s+=`<line class="mk" x1="${X(P)}" x2="${X(P)}" y1="22" y2="${base}"/><text class="ml" x="${X(P)}" y="16">true p = ${P}</text>`;
  else s+=`<text class="ml" x="${W/2}" y="16" style="fill:var(--muted)">true p = ?  (we can't see it)</text>`;
  if(c){ const y=92; const miss=reveal&&!c.hit;
    if(!ptOnly) s+=`<line class="${reveal?(miss?'miss':'hit'):'cap'}" style="stroke-width:5;opacity:1" x1="${X(c.lo)}" x2="${X(c.hi)}" y1="${y}" y2="${y}"/>`
      +`<line class="cap" x1="${X(c.lo)}" x2="${X(c.lo)}" y1="${y-14}" y2="${y+14}"/><line class="cap" x1="${X(c.hi)}" x2="${X(c.hi)}" y1="${y-14}" y2="${y+14}"/>`;
    s+=`<circle class="pd" cx="${X(c.ph)}" cy="${y}" r="8"/><foreignObject x="${X(c.ph)-60}" y="${y-52}" width="120" height="30"><div xmlns="http://www.w3.org/1999/xhtml" class="fo">${tex('\\hat p='+f2(c.ph))}</div></foreignObject>`;
    if(!ptOnly && c.hi>c.lo) s+=`<text class="tk" x="${X(c.lo)}" y="${y+34}">${f3(c.lo)}</text><text class="tk" x="${X(c.hi)}" y="${y+34}">${f3(c.hi)}</text>`; }
  s+=`<text class="at" x="${W/2}" y="${H-4}">proportion who will vote Blue</text></svg>`;
  return s;
}
function forestSVG(){
  const W=640,H=480,L=14,R=14,top=26,base=H-40, rows=ci.run.length||100, rh=(base-top)/rows;
  const {X,s:ax}=ciAxis(W,L,R,top,base);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="100 polls, each with its own confidence interval">${ax}`;
  s+=`<line class="mk" x1="${X(P)}" x2="${X(P)}" y1="${top-4}" y2="${base}"/><text class="ml" x="${X(P)}" y="${top-10}">true p = ${P}</text>`;
  ci.run.forEach((c,i)=>{ const y=top+rh*(i+.5);
    s+=`<line class="${c.hit?'hit':'miss'}" x1="${X(c.lo)}" x2="${X(c.hi)}" y1="${y}" y2="${y}"/><circle class="pd${c.hit?'':' miss'}" cx="${X(c.ph)}" cy="${y}" r="${c.hit?1.5:2.2}"/>`; });
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/><text class="at" x="${W/2}" y="${H-4}">each row = one poll's confidence interval</text></svg>`;
  return s;
}

/* ---------- viz: standard normal curve, z-table, p(1-p), and the "flip" ---------- */
function normSVG(o){
  const W=640,H=o.h||270,L=22,R=22,T=36,B=o.hat?66:44, pw=W-L-R, ph=H-T-B, base=T+ph;
  const X=z=>L+(z+4)/8*pw, f=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI), Y=z=>base-f(z)/0.4*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Standard normal curve">`;
  for(let z=-3;z<=3;z++){
    s+=`<line class="gl" x1="${X(z)}" x2="${X(z)}" y1="${T}" y2="${base}"/><text class="tk" x="${X(z)}" y="${base+16}">${z}</text>`;
    if(o.hat) s+=`<text class="tk" x="${X(z)}" y="${base+33}" style="fill:var(--accInk)">${f3(o.hat.mu+z*o.hat.sd)}</text>`;
  }
  (o.shades||[]).forEach(sh=>{
    const a=Math.max(-4,sh.a), b=Math.min(4,sh.b); let d=`M${X(a)},${base}`;
    for(let i=0;i<=60;i++){ const x=a+(b-a)*i/60; d+=`L${X(x)},${Y(x)}`; }
    s+=`<path class="${sh.cls}" d="${d}L${X(b)},${base}Z"/>`;
    if(sh.label) s+=`<text class="${sh.big?'bigl':'ml'}" x="${X(sh.lx)}" y="${sh.ly!=null?sh.ly:base-26}">${sh.label}</text>`;
  });
  let d=''; for(let i=0;i<=160;i++){ const z=-4+8*i/160; d+=(i?'L':'M')+X(z)+','+Y(z); }
  s+=`<path class="curve" d="${d}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  (o.marks||[]).forEach(m=>{ s+=`<line class="mk" x1="${X(m.x)}" x2="${X(m.x)}" y1="${T-4}" y2="${base}"/><text class="ml" x="${X(m.x)}" y="${T-10}">${m.label}</text>`; });
  s+=`<text class="at" x="${W/2}" y="${H-4}">${o.hat?'top: z-score (SEs from the center)   bottom: poll result p̂':'z-score (number of SEs from the center)'}</text></svg>`;
  return s;
}
// z-table: area to the LEFT of z (negative z only; positive z follows by symmetry)
const zcell=z=>{ const zr=Math.round(z*100), rt=Math.ceil(zr/10); return [rt,rt*10-zr]; };
const tabVal=(rt,c)=>Math.round(Phi((rt*10-c)/100)*1e4)/1e4;
const tabStr=v=>v.toFixed(4).replace(/^0/,'');
function zInvCells(area){   // the table cell(s) whose area is closest to `area`
  const [r0]=zcell(invPhi(area)), start=Math.max(-34,Math.min(-6,r0-3)); let best=1, cells=[];
  for(let rt=start;rt<=start+6;rt++) for(let c=0;c<10;c++){ const dd=Math.abs(tabVal(rt,c)-area);
    if(dd<best-1e-9){ best=dd; cells=[[rt,c]]; } else if(Math.abs(dd-best)<=1e-9) cells.push([rt,c]); }
  return cells;
}
function zTabHTML(z0,hi){
  const [r0]=zcell(z0), start=Math.max(-34,Math.min(-6,r0-3));
  const hr=new Set((hi||[]).map(h=>h[0])), hc=new Set((hi||[]).map(h=>h[1]));
  let h=`<table class="zt" aria-label="z-table"><thead><tr><th>z</th>`;
  for(let c=0;c<10;c++) h+=`<th class="${hc.has(c)?'hh':''}">.0${c}</th>`;
  h+=`</tr></thead><tbody>`;
  for(let rt=start;rt<=start+6;rt++){ h+=`<tr><th class="${hr.has(rt)?'hh':''}">${(rt/10).toFixed(1).replace('-','−')}</th>`;
    for(let c=0;c<10;c++){ const on=(hi||[]).some(x=>x[0]===rt&&x[1]===c); h+=`<td class="${on?'hi':''}">${tabStr(tabVal(rt,c))}</td>`; }
    h+=`</tr>`; }
  return h+`</tbody></table><div class="zcap">Each entry is the area to the <b>left</b> of z. Row = z to one decimal, column = the second decimal.</div>`;
}
function pqSVG(hi){
  const W=640,H=260,L=46,R=20,T=26,B=46, pw=W-L-R, ph=H-T-B, base=T+ph;
  const X=p=>L+p*pw, Y=v=>base-v/0.25*ph*0.95;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="p times one minus p is largest at 0.5">`;
  [0,.25,.5,.75,1].forEach(p=>{ s+=`<line class="gl" x1="${X(p)}" x2="${X(p)}" y1="${T}" y2="${base}"/><text class="tk" x="${X(p)}" y="${base+16}">${p}</text>`; });
  [0,.1,.2,.25].forEach(v=>{ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${L-8}" y="${Y(v)+4}" style="text-anchor:end">${v}</text>`; });
  let d=''; for(let i=0;i<=100;i++){ const p=i/100; d+=(i?'L':'M')+X(p)+','+Y(p*(1-p)); }
  s+=`<path class="pq" d="${d}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  if(hi) s+=`<line class="mk" x1="${X(.5)}" x2="${X(.5)}" y1="${T}" y2="${base}"/><circle class="pd" cx="${X(.5)}" cy="${Y(.25)}" r="7" style="fill:var(--acc)"/><text class="ml" x="${X(.5)+10}" y="${Y(.25)-10}" style="text-anchor:start">p = 0.5 gives the maximum, 0.25</text>`;
  s+=`<text class="at" x="${W/2}" y="${H-4}">p (proportion who will vote Blue)</text><text class="ml" x="${L}" y="${T-8}" style="text-anchor:start">p(1 − p)</text></svg>`;
  return s;
}
function flipSVG(c){
  const W=640,H=270,L=14,R=14,base=226; const {X,s:ax}=ciAxis(W,L,R,26,base);
  const cls=c.hit?'hit':'miss', yA=92, yB=170, verdict=c.hit?'YES':'NO';
  const band=(y,ctr)=>`<line class="${cls}" style="stroke-width:6;opacity:.9" x1="${X(ctr-c.me)}" x2="${X(ctr+c.me)}" y1="${y}" y2="${y}"/><line class="cap" x1="${X(ctr-c.me)}" x2="${X(ctr-c.me)}" y1="${y-11}" y2="${y+11}"/><line class="cap" x1="${X(ctr+c.me)}" x2="${X(ctr+c.me)}" y1="${y-11}" y2="${y+11}"/>`;
  const pDot=y=>`<circle cx="${X(P)}" cy="${y}" r="7" style="fill:var(--bg);stroke:var(--ink);stroke-width:2.5"/><text class="ml" x="${X(P)}" y="${y+26}">p</text>`;
  const hDot=y=>`<circle class="pd" cx="${X(c.ph)}" cy="${y}" r="7"/><text class="ml" x="${X(c.ph)}" y="${y-14}" style="fill:var(--blue)">p̂</text>`;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="The same distance works in both directions">${ax}<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  s+=`<text class="ml" x="${L}" y="${yA-32}" style="text-anchor:start">1. Band of ±ME around the true p. Is p̂ inside?  ${verdict}</text>`+band(yA,P)+pDot(yA)+hDot(yA);
  s+=`<text class="ml" x="${L}" y="${yB-32}" style="text-anchor:start">2. Band of ±ME around p̂ (our interval). Is p inside?  ${verdict}</text>`+band(yB,c.ph)+pDot(yB)+hDot(yB);
  s+=`<text class="at" x="${W/2}" y="${H-4}">proportion who will vote Blue</text></svg>`;
  return s;
}

 {num:'01',name:'The Race',steps:[
  {cap:'The setup',
   html:()=>`<p>A district is about to vote. Two candidates, ${Rd} and ${Bl}. Each dot is one voter, <b>10,000 voters</b> in all.</p>${ask('c1pop','Who is the <b>population</b>? Who is one <b>individual</b>? What do we record about each one?',`<b>Population:</b> all 10,000 voters. <b>Individual:</b> one voter. <b>Variable:</b> who they will vote for (${Rd} or ${Bl}), a categorical variable.`)}`,
   viz:()=>greyPop('The district','10,000 voters')},
  {cap:'The question',
   html:()=>`<p>The pollster wants one number: the <b>proportion of all voters who will vote ${Bl}</b>. Call it ${T('p')}.</p>${ask('c1par',`${T('p')} describes the whole population. Is it a <b>parameter</b> or a <b>statistic</b>?`,`A ${tag('parameter')}: a number that describes a population. It is fixed, but right now we do not know it.`)}`,
   viz:()=>greyPop('The district','p is hidden','p = ?')},
  {cap:'Finding p, in theory',
   html:()=>`<p>Suppose we <i>could</i> see every single vote.</p>${ask('c1how','How would you compute p?',`Count the Blue voters and divide by everyone:${eq(raw`p=\frac{\text{Blue voters}}{\text{all voters}}`)}`)}`,
   viz:()=>greyPop('The district','p is hidden','p = ?')},
  {cap:'Count the votes',
   html:()=>`<p>For this demo only, peek behind the curtain.</p>${ask('c1cnt','Make a guess: out of 10,000 voters, how many will vote Blue? Then reveal the votes and compute p.',`${eq(raw`p=\frac{\text{Blue voters}}{\text{all voters}}=\frac{${NBLUE}}{${N}}=${f2(P)}`)}<p class="note">Click the grid to sort the voters by vote.</p>`)}`,
   viz:()=>rv.c1cnt?truthPop('The truth (nobody can see this)',`p = ${f2(P)}`):greyPop('The district','p is hidden','p = ?')},
  {cap:'Who wins?',
   html:()=>`<p>Blue has ${Math.round(P*100)}%, Red has ${Math.round((1-P)*100)}%.</p>${ask('c1win','Who wins the election, and by how many percentage points?',`${Bl} wins by <b>${Math.round((2*P-1)*100)} points</b> (${Math.round(P*100)}% to ${Math.round((1-P)*100)}%). Remember this number: a good poll should show Blue ahead.`)}`,
   viz:()=>truthPop('The truth (nobody can see this)',`p = ${f2(P)}`)},
  {cap:'Why not just count?',
   html:()=>`<p>Back to real life.</p>${ask('c1why','If counting everyone gives p exactly, why do pollsters bother with samples?','The votes have not happened yet, and even asking 10,000 people is slow and expensive. In real life <b>nobody</b> sees the truth. In this demo, only we know p = 0.54.')}`,
   viz:()=>truthPop('The truth (nobody can see this)',`p = ${f2(P)}`)},
  {cap:'The plan',
   html:()=>`<p>Instead the pollster asks a <b>random sample of 100 voters</b>.</p>${ask('c1phat','How would you turn the sample into an estimate of p? Write a formula, and choose a symbol.',`${eq(raw`\hat p=\frac{x}{n}=\frac{\text{Blue in sample}}{\text{sample size}}`)}This is the ${tag('sample proportion')}, a <b>statistic</b>. ${T('p')} describes the population (a parameter). ${PH} describes a sample (a statistic).`)}`,
   viz:()=>truthPop('The truth (nobody can see this)',`p = ${f2(P)}`)},
  {cap:'Check for understanding', check:true,
   html:()=>`${checkIntro}${qa('c1q1',1,`A pollster asks 500 randomly chosen voters and 285 say they will vote ${Bl}. Name the population and the sample, then compute ${PH}.`,`Population: all 10,000 voters. Sample: the 500 voters asked. ${eq(raw`\hat p=\frac{285}{500}=0.57`)}`)}${qa('c1q2',2,`Parameter or statistic? (a) The proportion of <i>all</i> voters who will vote ${Bl}. (b) The proportion of ${Bl} among the 500 voters asked. Which one changes if the pollster draws a new sample?`,`(a) parameter, ${T('p')}. (b) statistic, ${PH}. The <b>statistic</b> changes from sample to sample. The parameter stays fixed.`)}`,
   viz:()=>truthPop('The truth (nobody can see this)',`p = ${f2(P)}`)}
 ]},
 {num:'02',name:'One Poll',steps:[
  {cap:'Pick 100 at random',
   enter:()=>{ if(!one.cur) takePoll(); },
   html:()=>`<p>The pollster picks <b>100 voters at random</b> (highlighted) and asks each one.</p>${ask('c2exp',`Before we see the answers: will the poll land exactly on ${T('p')} = 0.54?`,'Probably not. A random sample will be <i>close</i> to the population, but not identical to it.')}`,
   viz:()=>vizPop({mode:'truth',mask:one.first.mask,cap:'Poll #1',tail:'highlighted = asked'})},
  {cap:'Tally the sample',
   html:()=>{ const k=one.first.k; return `<p>The poll box shows what the 100 voters said: <b>${k}</b> ${Bl}, <b>${100-k}</b> ${Rd}.</p>${ask('c2phat',`Compute the sample proportion ${PH}.`,eq(raw`\hat p=\frac{x}{n}=\frac{${k}}{100}=${f2(k/100)}`))}`; },
   viz:()=>vizPop({mode:'truth',mask:one.first.mask,sample:one.first,cap:'Poll #1',tail:'highlighted = asked'})},
  {cap:'Sampling error',
   html:()=>{ const ph=one.first.k/100, d=ph-P;
     return `<p>This poll says ${f2(ph)}. The truth is ${f2(P)}.</p>${ask('c2err','How far off is the poll? What would you call that gap?',`${Math.abs(d)<0.0049?'Right on target this time, but that is luck.':`Off by <b>${f2(Math.abs(d))}</b>.`} The gap between a statistic and the parameter is <b>sampling error</b>.`)}${ph<0.5?rem(`This poll shows ${Rd} ahead, even though ${Bl} will win.`):''}`; },
   viz:()=>vizPop({mode:'truth',mask:one.first.mask,sample:one.first,cap:'Poll #1',tail:'highlighted = asked'})},
  {cap:'A second pollster',
   html:()=>`<p>Another pollster asks a <i>different</i> random 100 voters from the same district.</p>${ask('c2diff',`Will the second poll also give ${f2(one.first.k/100)}? Click <b>Take another poll</b> to find out.`,'Almost certainly not. Different people land in the sample, so the result changes.')}`,
   viz:()=>{ const h=one.hist;
     const chips=h.slice(-24).map((v,i,a)=>`<span class="chip${i===a.length-1?' last':''}">${f2(v)}</span>`).join('');
     return vizPop({mode:'truth',mask:one.cur.mask,sample:one.cur,cap:`Poll #${h.length}`,tail:'highlighted = asked',
       ctl:`<button class="btn primary" data-act="poll">Take another poll</button><span class="lab">${PH} so far</span><div class="chips">${chips}</div>`}); }},
  {cap:'Poll again and again',
   html:()=>{ const h=one.hist, lo=Math.min(...h), hi=Math.max(...h);
     return `<p>Keep clicking <b>Take another poll</b>.</p>`+(h.length<2?note('Take at least two polls.'):
       `<p>Same voters, same p, but ${PH} ranges from <b>${f2(lo)}</b> to <b>${f2(hi)}</b> over ${h.length} polls.</p>`)+ask('c2var','The district never changed. Why does p&#770; keep changing?',`Chance decides who lands in each sample. ${rem(`${PH} changes from sample to sample: <b>sampling variability</b>.`)}`); },
   viz:()=>{ const h=one.hist;
     const chips=h.slice(-24).map((v,i,a)=>`<span class="chip${i===a.length-1?' last':''}">${f2(v)}</span>`).join('');
     return vizPop({mode:'truth',mask:one.cur.mask,sample:one.cur,cap:`Poll #${h.length}`,tail:'highlighted = asked',
       ctl:`<button class="btn primary" data-act="poll">Take another poll</button><span class="lab">${PH} so far</span><div class="chips">${chips}</div>`}); }},
  {cap:'Is the pollster wrong?',
   html:()=>`<p>The polls disagree with each other.</p>${ask('c2bias','Did the pollsters do something wrong? How could you tell the difference between random variation and a flawed method?','No. Same method, random samples, so some variation is <b>expected</b>. A flawed method (bias) would push <i>every</i> poll the same way, not scatter them around the truth.')}`,
   viz:()=>vizPop({mode:'truth',mask:one.cur.mask,sample:one.cur,cap:`Poll #${one.hist.length}`,tail:'highlighted = asked'})},
  {cap:'Condition 1: random',
   html:()=>`<p>The scatter of ${PH} is <i>predictable</i>, but only under conditions.</p>${ask('c2rand','How should the pollster choose the 100 voters so that no group is favored?',`<ul class="chk"><li><span><b>Random:</b> every voter has a fair chance of being picked.</span></li></ul>Randomness is what lets us describe the variation with probability.`)}`,
   viz:()=>vizPop({mode:'truth',mask:one.cur.mask,sample:one.cur,cap:`Poll #${one.hist.length}`,tail:'highlighted = asked'})},
  {cap:'Condition 2: independent',
   html:()=>`<p>Sampling without replacement makes the voters slightly dependent. It matters little when the sample is small compared with the population.</p>${ask('c2ten','The district has 10,000 voters. What is the largest sample that still satisfies the 10% rule? Is n = 100 okay?',`10% of 10,000 = 1,000, so we need n &le; 1,000. And 100 &le; 1,000, so we are fine.`)}`,
   viz:()=>vizPop({mode:'truth',mask:one.cur.mask,sample:one.cur,cap:`Poll #${one.hist.length}`,tail:'highlighted = asked'})},
  {cap:'Check for understanding', check:true,
   html:()=>`${checkIntro}${qa('c2q1',1,`A radio station asks listeners to call in and say who they will vote for. Does this satisfy the <b>random</b> condition?`,`No. Only people who hear the show <i>and</i> choose to call are included. That is a biased sample, so the usual rules for ${PH} do not apply.`)}${qa('c2q2',2,`A pollster wants to ask 1,500 voters from this district of 10,000. Is the 10% condition met? What is the largest sample that is okay?`,`10% of 10,000 = 1,000. Since 1,500 &gt; 1,000, the condition is <b>not</b> met. The largest sample that is okay is 1,000.`)}`,
   viz:()=>vizPop({mode:'truth',mask:one.cur.mask,sample:one.cur,cap:`Poll #${one.hist.length}`,tail:'highlighted = asked'})}
 ]},
 {num:'03',name:'Many Polls',steps:[
  {cap:'Many pollsters',
   enter:()=>{ if(sim.n!==100) sim=mkSim(100); },
   html:()=>`<p>Imagine <b>1,000 different pollsters</b>, each asking their own random 100 voters. Each reports one ${PH}.</p>${ask('c3pred',`Where do you expect these 1,000 values of ${PH} to pile up on the number line? How spread out will they be?`,'Most should land near the truth, 0.54, with a few farther out on either side. Let&rsquo;s test it.')}`,
   viz:()=>simH('Poll results, stacked')},
  {cap:'One at a time',
   enter:()=>{ if(sim.total===0) simAdd(sim,1); },
   html:()=>`<p>Put each poll&rsquo;s ${PH} on the number line, <b>one square per poll</b>. Click <b>+1</b> a few times.</p>${ask('c3next','Before each click: will the next square land close to 0.54 or far from it?','Usually close, sometimes far. Any <i>one</i> poll can be off, but the pile shows what is typical.')}`,
   viz:()=>simH('Poll results, stacked',{ctl:addButtons()})},
  {cap:'Faster',
   html:()=>`<p>Now add <b>+10</b>, then <b>+100</b>.</p>`+(sim.total<100?note('Add more polls to see the pattern.'):ask('c3shape','What shape is the pile taking?','A <b>bell shape</b>, centered near 0.54.')),
   viz:()=>simH('Poll results, stacked',{ctl:addButtons()})},
  {cap:'A thousand polls',
   enter:()=>{ if(sim.n!==100) sim=mkSim(100); if(sim.total<1000) simAdd(sim,1000-sim.total); },
   html:()=>`<p>Here are 1,000 polls.</p>${ask('c3desc','Describe the <b>center</b>, <b>shape</b>, and <b>spread</b> of this pile.','<ul class="chk"><li><span>Center: right at <b>0.54</b>, the true p</span></li><li><span>Shape: symmetric and <b>bell-shaped</b></span></li><li><span>Spread: nearly all polls fall between about 0.44 and 0.64</span></li></ul>')}`,
   viz:()=>simH('Poll results, stacked',{ctl:addButtons()})},
  {cap:'Name it',
   html:()=>`<p>This pile is the ${tag('sampling distribution of '+PH)}: how ${PH} behaves across <i>all</i> possible polls of 100 voters.</p>${ask('c3sq','What does <b>one square</b> represent? What does the <b>whole pile</b> represent?',`One square = one poll&rsquo;s ${PH}. The whole pile = the sampling distribution of ${PH}.`)}`,
   viz:()=>simH('Sampling distribution of p&#770;',{ctl:addButtons()})},
  {cap:'Center',
   html:()=>`<p>Look at the readout under the chart.</p>${ask('c3ctr',`The average of all the ${PH} values is shown as <b>mean p&#770;</b>. How does it compare with p? What does that say about polling?`,`The mean of ${PH} is ${f3(simMean(sim))}, essentially the true p = 0.54. On average, polls get it right: ${PH} is an <b>unbiased</b> estimator.${eq(raw`\text{center}=p=${f2(P)}`)}`)}`,
   viz:()=>simH('Sampling distribution of p&#770;')},
  {cap:'Spread: standard error',
   html:()=>`<p>The <b>spread</b> of the pile is measured by its standard deviation. For ${PH} we call it the ${tag('standard error')} (SE).</p>${eq(raw`SE=\sqrt{\frac{p(1-p)}{n}}`)}${ask('c3se','Plug in p = 0.54 and n = 100. What is the SE?',`${eq(raw`SE=\sqrt{\frac{${f2(P)}(${f2(1-P)})}{100}}=${f4(SE100)}`)}The simulation agrees: SD of ${PH} = ${f4(simSD(sim))}.`)}`,
   viz:()=>simH('Sampling distribution of p&#770;',{marks:rv.c3se?[{x:P-SE100,label:f3(P-SE100)},{x:P,label:'p'},{x:P+SE100,label:f3(P+SE100)}]:[{x:P,label:'true p = 0.54'}]})},
  {cap:'Shape: is it normal?',
   html:()=>`<p>The pile looks like a bell. A normal curve describes it well when the sample is large enough.</p>${ask('c3cond','The rule: both <b>np</b> and <b>n(1 &minus; p)</b> must be at least 10. Check it for n = 100, p = 0.54.',`${eq(raw`np=100(${f2(P)})=${Math.round(100*P)}\ge10\qquad n(1-p)=100(${f2(1-P)})=${Math.round(100*(1-P))}\ge10`)}Both pass, so ${PH} is approximately normal.`)}`,
   viz:()=>simH('Sampling distribution of p&#770;',{curve:rv.c3cond?{mu:P,sd:SE100}:null})},
  {cap:'Putting it together',
   html:()=>`<p>Three facts describe the sampling distribution.</p>${ask('c3sum','State the center, spread, and shape of the sampling distribution of p&#770; for polls of 100 voters.',`${eq(raw`\hat p\approx N\big(\text{mean}=${f2(P)},\ \text{SD}=${f4(SE100)}\big)`)}<p>Center = p, spread = SE, shape = approximately normal.</p>`)}`,
   viz:()=>simH('Sampling distribution of p&#770;',{curve:{mu:P,sd:SE100}})},
  {cap:'Does n matter?',
   html:()=>`<p>A pollster wants a more accurate poll.</p>${ask('c3pn','If each poll asked <b>more voters</b>, would the pile get wider, narrower, or stay the same? Would the center move?','Narrower. The center stays at 0.54 and only the spread changes. We will test it next.')}`,
   viz:()=>simH('Sampling distribution of p&#770;',{curve:{mu:P,sd:SE100}})},
  {cap:'Sample size matters',
   enter:()=>{ if(sim.total<2000) simAdd(sim,2000-sim.total); },
   html:()=>{ const n=sim.n, se=seOf(P,n);
     return `<p>Pick a poll size. Each choice re-runs 3,000 polls.</p>${eq(raw`SE=\sqrt{\frac{${f2(P)}(${f2(1-P)})}{${n}}}=${f4(se)}`)}<ul class="chk"><li><span>The center stays at 0.54.</span></li><li><span><b>Bigger n, smaller SE, tighter pile.</b></span></li></ul>`; },
   viz:()=>{ const v=simH('Sampling distribution of p&#770;',{curve:{mu:P,sd:seOf(P,sim.n)}});
     v.ctl=`<span class="lab">Voters per poll</span>`+seg('setn','n',[[25,'n = 25'],[100,'n = 100'],[400,'n = 400'],[1000,'n = 1,000']],sim.n); return v; }},
  {cap:'Quadrupling n',
   html:()=>{ const se=seOf(P,sim.n); return `<p>Currently n = ${sim.n}, SE = ${f4(se)}.</p>${ask('c3quad','Compare n = 100 with n = 400 (four times as many voters). By what factor does the SE shrink? Predict, then try it.',`${eq(raw`SE_{400}=\sqrt{\frac{${f2(P)}(${f2(1-P)})}{400}}=${f4(seOf(P,400))}\quad\text{vs.}\quad SE_{100}=${f4(SE100)}`)}Cut in <b>half</b>. Because n sits under a square root, you need <b>4 times</b> the voters to halve the SE.`)}`; },
   viz:()=>{ const v=simH('Sampling distribution of p&#770;',{curve:{mu:P,sd:seOf(P,sim.n)}});
     v.ctl=`<span class="lab">Voters per poll</span>`+seg('setn','n',[[25,'n = 25'],[100,'n = 100'],[400,'n = 400'],[1000,'n = 1,000']],sim.n); return v; }},
  {cap:'Check for understanding', check:true,
   html:()=>{ const se9=seOf(P,900); return `${checkIntro}${qa('c3q1',1,`A pollster asks <b>900</b> voters. Describe the sampling distribution of ${PH}: center, SE, and whether it is approximately normal.`,`Center = 0.54. ${eq(raw`SE=\sqrt{\frac{${f2(P)}(${f2(1-P)})}{900}}=${f4(se9)}`)}np = ${Math.round(900*P)} and n(1 &minus; p) = ${Math.round(900*(1-P))}, both at least 10, so approximately normal.`)}${qa('c3q2',2,`Poll A asks 25 voters, Poll B asks 1,000. Which is more likely to land far from 0.54, and why?`,`Poll A. Its SE is ${f4(seOf(P,25))}, versus ${f4(seOf(P,1000))} for Poll B. A bigger sample gives a smaller SE, so Poll B stays closer to the truth.`)}${qa('c3q3',3,`The SE for n = 100 is ${f4(SE100)}. To cut it to <b>one-third</b> of that, how many voters are needed?`,`The SE goes with 1/&radic;n, so one-third needs <b>9 times</b> the voters: 9 &times; 100 = 900. Check: ${f4(seOf(P,900))} &approx; ${f4(SE100/3)}.`)}`; },
   viz:()=>simH('Sampling distribution of p&#770;',{curve:{mu:P,sd:seOf(P,sim.n)}})}
 ]},
 {num:'04',name:'Probabilities',steps:[
  {cap:'Recall the model',
   html:()=>`<p>Here are 10,000 simulated polls of 100 voters each.</p>${ask('c4rec','From Chapter 3: what are the center, SE, and shape of this distribution?',`Center ${f2(P)}, SE ${f4(SE100)}, approximately normal:${eq(raw`\hat p\approx N(\text{mean}=${f2(P)},\ \text{SD}=${f4(SE100)})`)}The curve is the model.`)}`,
   viz:()=>bigH('10,000 polls of 100 voters',{curve:rv.c4rec?{mu:P,sd:SE100}:null,marks:[{x:P,label:'p = 0.54'}]})},
  {cap:'Area is probability',
   html:()=>`<p>Bars are simulated polls. The curve is the normal model. Under the curve, <b>area = probability</b>.</p>${ask('c4tot','What is the total area under the curve? What would the area between 0.44 and 0.64 mean?','Total area = 1 (100% of polls). The area between two values is the <b>chance a poll lands there</b>.')}`,
   viz:()=>bigH('10,000 polls of 100 voters',{marks:[{x:P,label:'p = 0.54'}]})},
  {cap:'Can a poll get it wrong?',
   html:()=>`<p>Blue has 54%, but a poll could still show ${Rd} ahead: ${T('\\hat p<0.50')}.</p>${ask('c4guess',`Gut check: out of 100 polls of 100 voters, how many would show ${Rd} ahead?`,'Hold onto your guess. We will compute the exact chance in a few steps.')}`,
   viz:()=>bigH('Shaded: p&#770; < 0.50',{areaRange:[0,0.5],shade:c=>c<0.4999,marks:[{x:0.5,label:'0.50'}]})},
  {cap:'Measure in SEs',
   html:()=>{ const z=(0.5-P)/SE100; return `<p>To find the shaded area we first ask: <b>how many SEs</b> is 0.50 from the center?</p>${ask('c4z1','Compute (0.50 &minus; 0.54) &divide; SE. Is 0.50 above or below the center, and by how many SEs?',`${eq(raw`z=\frac{0.50-${f2(P)}}{${f4(SE100)}}=${f2(z)}`)}0.50 is about <b>${Math.abs(zr2(z)).toFixed(2)} SEs below</b> the center. This is a ${tag('z-score')}: ${T('z=\\dfrac{x-\\text{mean}}{\\text{SD}}')}.`)}`; },
   viz:()=>bigH('Shaded: p&#770; < 0.50, in SE units',{areaRange:[0,0.5],shade:c=>c<0.4999,marks:ruler(SE100)})},
  {cap:'The standard normal curve',
   html:()=>{ const z=zr2((0.5-P)/SE100); return `<p>Subtracting the mean and dividing by the SE re-labels the axis in SEs. Every normal curve becomes the same one: the ${tag('standard normal')}, mean 0 and SD 1.</p>${ask('c4std',`Where does 0.50 sit on the new axis, and what happens to the shaded area?`,`At z = ${sgn(z)}. The shape and the shaded area are <b>unchanged</b>. Only the labels on the axis changed.`)}`; },
   viz:()=>{ const z=zr2((0.5-P)/SE100);
     return {cap:'Standard normal curve',tail:'mean 0, SD 1',body:normSVG({hat:{mu:P,sd:SE100},shades:[{a:-4,b:z,cls:'tail'}],marks:rv.c4std?[{x:z,label:'z = '+sgn(z)}]:[]})}; }},
  {cap:'Reading a z-table',
   html:()=>{ const z=zr2((0.5-P)/SE100); return `<p>A ${tag('z-table')} gives the area to the <b>left</b> of any z.</p>${ask('c4tab',`Find z = ${sgn(z)}: go down to the row for ${(zcell(z)[0]/10).toFixed(1).replace('-','−')}, across to the column .0${zcell(z)[1]}. What area do you read?`,`<b>${tabStr(A4(z))}</b>. The table says about ${(A4(z)*100).toFixed(1)}% of the area is to the left of z = ${sgn(z)}.`)}`; },
   viz:()=>{ const z=zr2((0.5-P)/SE100);
     return {cap:'Standard normal curve and z-table',tail:'area to the left',body:normSVG({h:230,shades:[{a:-4,b:z,cls:'tail'}],marks:[{x:z,label:'z = '+sgn(z)}]})+zTabHTML(z,rv.c4tab?[zcell(z)]:null)}; }},
  {cap:'The answer',
   html:()=>{ const z=(0.5-P)/SE100, pr=A4(z), b=bigSim(); let emp=0; b.bins.forEach((c,m)=>{ if(binCtr(m,100)<0.4999) emp+=c; });
     return `${eq(raw`P(\hat p<0.50)=P(Z<${f2(zr2(z))})=${tabStr(pr)}`)}<p class="note">TI-84: ${cd(`normalcdf(-1E99, 0.50, 0.54, ${f4(SE100)})`)} = ${f4(Phi(z))} (no rounding of z).</p>${ans(`about ${(pr*100).toFixed(0)}%`,'roughly 1 poll in 5 calls the wrong winner')}${note(`Simulation: ${(emp/b.total*100).toFixed(1)}%. Close enough.`)}${ask('c4int','Say it in a sentence. What does this probability mean for the pollster?',`Even though ${Bl} will win, about 1 in 5 polls of 100 voters would show ${Rd} ahead. Compare with your gut check.`)}`; },
   viz:()=>bigH('Shaded: p&#770; < 0.50',{areaRange:[0,0.5],shade:c=>c<0.4999,marks:[{x:0.5,label:'0.50'}]})},
  {cap:'A bigger poll?',
   html:()=>{ const n=prob.n, se=seOf(P,n), z=(0.5-P)/se; return `<p>A 1-in-5 chance of the wrong winner is uncomfortable.</p>${ask('c4n','What can the pollster change to reduce it? Predict the probability for n = 400, then try the buttons.','Ask more voters. A larger n shrinks the SE, so 0.50 sits <b>more SEs</b> below the center and the tail gets smaller.')}${ans(`n = ${n}: z = ${sgn(zr2(z))}, P = ${tabStr(A4(z))}`,`SE = ${f4(se)}`)}`; },
   viz:()=>{ const n=prob.n, se=seOf(P,n), z=zr2((0.5-P)/se);
     return {cap:`P(p&#770; < 0.50) for polls of ${n}`,tail:`SE = ${f4(se)}`,body:normSVG({hat:{mu:P,sd:se},shades:[{a:-4,b:z,cls:'tail'}],marks:[{x:z,label:'z = '+sgn(z)}]}),
       ctl:`<span class="lab">Voters per poll</span>`+seg('pn','n',[[100,'n = 100'],[400,'n = 400'],[1000,'n = 1,000']],prob.n)}; }},
  {cap:'Check for understanding', check:true,
   html:()=>{ const z1=(0.60-P)/SE100, z2=(0.58-P)/SE100, zz=zr2(z2), mid=1-2*A4(-zz);
     return `${checkIntro}<p class="note">Use polls of n = 100: ${PH} &approx; N(0.54, ${f4(SE100)}).</p>${qa('c4q1',1,`What is the chance a poll shows ${Bl} at <b>60% or more</b>, ${T('P(\\hat p\\ge0.60)')}?`,`${eq(raw`z=\frac{0.60-${f2(P)}}{${f4(SE100)}}=${f2(zr2(z1))}`)}The table has only negative z, so use symmetry: ${T('P(Z\\ge '+f2(zr2(z1))+')=P(Z\\le-'+f2(zr2(z1))+')='+tabStr(A4(-zr2(z1)))+'')}. About <b>${(A4(-zr2(z1))*100).toFixed(0)}%</b>.`)}${qa('c4q2',2,`What is the chance a poll lands <b>between 0.50 and 0.58</b>? (Sketch the curve first.)`,`${eq(raw`P(0.50<\hat p<0.58)=P(-${f2(zz)}<Z<${f2(zz)})=1-2(${tabStr(A4(-zz))})=${mid.toFixed(4)}`)}About <b>${(mid*100).toFixed(0)}%</b> of polls.`)}`; },
   viz:()=>bigH('10,000 polls of 100 voters',{marks:[{x:P,label:'p = 0.54'}]})},
  {cap:'Working backwards',
   html:()=>`<p>So far we went from a <i>value</i> to a <i>probability</i>. Now flip it.</p>${ask('c4back','Which two values of p&#770; capture the <b>middle 95%</b> of polls? First guess: about how many SEs on each side of 0.54?','About <b>2 SEs</b> on each side (the 68&ndash;95&ndash;99.7 rule). We want the exact number.')}`,
   viz:()=>bigH('The middle 95%, in SE units',{marks:ruler(SE100)})},
  {cap:'Split the tails',
   html:()=>`<p>The middle 95% leaves 5% outside.</p>${ask('c4tail','How much area is in <b>each</b> tail? Why is it split evenly?','5% &divide; 2 = <b>2.5% = 0.025</b> in each tail. The curve is symmetric, so the two tails match.')}`,
   viz:()=>({cap:'Standard normal curve',tail:'middle 95%',body:normSVG({hat:{mu:P,sd:SE100},shades:[{a:-1.96,b:1.96,cls:'mid',label:'95%',lx:0,ly:100,big:true}].concat(rv.c4tail?[{a:-4,b:-1.96,cls:'tail',label:'0.025',lx:-2.9},{a:1.96,b:4,cls:'tail',label:'0.025',lx:2.9}]:[])})})},
  {cap:'Look up the area',
   html:()=>`<p>We know the area, 0.0250, and want the z that goes with it.</p>${ask('c4inv','Search <i>inside</i> the z-table for 0.0250. Which row and column is it? What z does that give?',`Row &minus;1.9, column .06, so <b>z = &minus;1.96</b>. By symmetry the upper cut-off is <b>+1.96</b>. This number is called the <b>critical value</b>.`)}`,
   viz:()=>({cap:'Standard normal curve and z-table',tail:'area 0.025 in each tail',body:normSVG({h:230,shades:[{a:-4,b:-1.96,cls:'tail',label:'0.025',lx:-2.9},{a:1.96,b:4,cls:'tail',label:'0.025',lx:2.9}],marks:rv.c4inv?[{x:-1.96,label:'−1.96'},{x:1.96,label:'+1.96'}]:[]})+zTabHTML(-1.96,rv.c4inv?zInvCells(0.025):null)})},
  {cap:'Back to p̂',
   html:()=>{ const z=Z[0.95], lo=P-z*SE100, hi=P+z*SE100; return `<p>Convert the z-scores back to polling results: ${T('\\text{value}=\\text{mean}+z\\cdot SE')}.</p>${ask('c4x','Compute the two cut-offs: 0.54 &plusmn; 1.96(0.0498).',`${eq(raw`0.54\pm1.96(${f4(SE100)})=(${f3(lo)},\ ${f3(hi)})`)}<p class="note">TI-84: ${cd('invNorm(0.025, 0.54, '+f4(SE100)+')')} and ${cd('invNorm(0.975, 0.54, '+f4(SE100)+')')}</p>`)}`; },
   viz:()=>{ const z=Z[0.95], lo=P-z*SE100, hi=P+z*SE100;
     return bigH('The middle 95% of p&#770;',{areaRange:rv.c4x?[lo,hi]:null,shade:rv.c4x?(c=>c>=lo&&c<=hi):null,marks:rv.c4x?[{x:lo,label:f3(lo)},{x:hi,label:f3(hi)}]:ruler(SE100)}); }},
  {cap:'In words',
   html:()=>{ const z=Z[0.95], b=bigSim(), lo=P-z*SE100, hi=P+z*SE100; let emp=0; b.bins.forEach((c,m)=>{ const x=binCtr(m,100); if(x>=lo&&x<=hi) emp+=c; });
     return `${ask('c4w','Finish the sentence: &ldquo;95% of polls land within ____ of the truth.&rdquo;',`<b>${f3(z*SE100)}</b> (that is 1.96 SEs). ${note(`Simulation: ${(emp/b.total*100).toFixed(1)}% of the 10,000 polls.`)}`)}${rem(`<b>Key idea:</b> 95% of polls land within 1.96 SEs of the truth. We will use this to build confidence intervals.`)}`; },
   viz:()=>{ const z=Z[0.95], lo=P-z*SE100, hi=P+z*SE100;
     return bigH('The middle 95% of p&#770;',{areaRange:[lo,hi],shade:c=>c>=lo&&c<=hi,marks:[{x:lo,label:f3(lo)},{x:hi,label:f3(hi)}]}); }},
  {cap:'Check for understanding', check:true,
   html:()=>{ const z9=Z[0.9], z99=Z[0.99], se4=seOf(P,400), z95=Z[0.95];
     return `${checkIntro}<p class="note">Polls of n = 100 unless stated: ${PH} &approx; N(0.54, ${f4(SE100)}).</p>${qa('c4q3',1,`Find the values that capture the middle <b>90%</b> of polls.`,`Tails: 0.05 each. In the table 0.0500 sits halfway between &minus;1.64 (.0505) and &minus;1.65 (.0495), so z = <b>&plusmn;${f3(z9)}</b>.${eq(raw`0.54\pm${f3(z9)}(${f4(SE100)})=(${f3(P-z9*SE100)},\ ${f3(P+z9*SE100)})`)}`)}${qa('c4q4',2,`Do the same for the middle <b>99%</b>. Is the range wider or narrower than for 95%?`,`Tails: 0.005 each, z = <b>&plusmn;${f3(z99)}</b> (between &minus;2.57 and &minus;2.58).${eq(raw`0.54\pm${f3(z99)}(${f4(SE100)})=(${f3(P-z99*SE100)},\ ${f3(P+z99*SE100)})`)}<b>Wider</b>: capturing more polls takes more room.`)}${qa('c4q5',3,`The pollster now asks 400 voters. Find the middle 95% of polls.`,`SE = ${f4(se4)}.${eq(raw`0.54\pm1.96(${f4(se4)})=(${f3(P-z95*se4)},\ ${f3(P+z95*se4)})`)}Narrower than with n = 100, because the SE is smaller.`)}`; },
   viz:()=>bigH('10,000 polls of 100 voters',{marks:[{x:P,label:'p = 0.54'}]})},
  {cap:'Try it yourself',
   html:()=>{ const c=prob.c, z=(c-P)/SE100, le=prob.dir==='le', pr=le?Phi(z):1-Phi(z), b=bigSim(); let emp=0; b.bins.forEach((n,m)=>{ const x=binCtr(m,100); if(le?x<=c+1e-9:x>=c-1e-9) emp+=n; });
     return `<p>Pick a direction and cutoff.</p>${eq(raw`P(\hat p ${le?'\\le':'\\ge'} ${f2(c)})=P(Z${le?'\\le':'\\ge'}${f2(z)})=${f4(pr)}`)}${note(`Model: <b>${(pr*100).toFixed(1)}%</b>. Simulation: <b>${(emp/b.total*100).toFixed(1)}%</b>.`)}`; },
   viz:()=>{ const c=prob.c, le=prob.dir==='le';
     const v=bigH(`Shaded: ${le?'p&#770; ≤':'p&#770; ≥'} ${f2(c)}`,{areaRange:le?[0,c]:[c,1],shade:x=>le?x<=c+1e-9:x>=c-1e-9,marks:[{x:c,label:f2(c)}]});
     v.ctl=`<span class="lab">Direction</span>`+seg('dir','dir',[['le','at most'],['ge','at least']],prob.dir)+`<span class="lab">Cutoff</span><button class="btn" data-act="cut" data-v="-0.05">&minus;0.05</button><button class="btn" data-act="cut" data-v="-0.01">&minus;0.01</button><button class="btn" data-act="cut" data-v="0.01">+0.01</button><button class="btn" data-act="cut" data-v="0.05">+0.05</button>`; return v; }}
 ]},
 {num:'05',name:'Confidence Intervals',steps:[
  {cap:'Real life',
   enter:()=>{ if(!ci.single) newSingle(); },
   html:()=>{ const c=ci.single; return `<p>In real life nobody knows p, and we get <b>one poll</b>:</p>${eq(raw`\hat p=\frac{${c.k}}{${c.n}}=${f2(c.ph)}`)}${ask('c5best','What is your best single guess for p? Is it probably exactly right?',`Best guess: ${PH} = ${f2(c.ph)}. But as Chapters 2 and 3 showed, ${PH} bounces around, so p is probably <i>not</i> exactly ${f2(c.ph)}.`)}`; },
   viz:()=>({cap:'One poll, true p unknown',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,false,true),ctl:newBtn})},
  {cap:'A range of plausible values',
   html:()=>`<p>So instead of one number we report a <b>range of plausible values</b>: ${PH} plus or minus some wiggle room.</p>${ask('c5wig','How much wiggle room? Use Chapter 4: how far from the truth do 95% of polls land?',`Within <b>1.96 SEs</b>. So the wiggle room is about 1.96 &times; SE. That multiplier needs a name and an explanation.`)}`,
   viz:()=>({cap:'One poll, true p unknown',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,false,true),ctl:newBtn})},
  {cap:'Where does z* come from?',
   html:()=>`<p>The multiplier is the ${tag('critical value z*')}. For a confidence level C, it is the z-score that leaves the middle C of the standard normal curve between &minus;z* and +z*.</p>${ask('c5zs','For C = 95%: what area is in each tail, and what is z*? (Recall Chapter 4.)',`Tails: (1 &minus; 0.95) &divide; 2 = 0.025 each. The table entry 0.0250 is z = &minus;1.96, so <b>z* = 1.96</b>.`)}`,
   viz:()=>({cap:'Critical value for 95% confidence',tail:'standard normal curve',body:normSVG({h:230,shades:[{a:-1.96,b:1.96,cls:'mid',label:'95%',lx:0,ly:100,big:true},{a:-4,b:-1.96,cls:'tail',label:'0.025',lx:-2.9},{a:1.96,b:4,cls:'tail',label:'0.025',lx:2.9}],marks:rv.c5zs?[{x:-1.96,label:'−z* = −1.96'},{x:1.96,label:'z* = 1.96'}]:[]})+zTabHTML(-1.96,rv.c5zs?zInvCells(0.025):null)})},
  {cap:'Other confidence levels',
   html:()=>{ const C=zs.level, t=(1-C)/2, z=Z[C]; return `<p>Choose 90%, 95%, or 99% and watch the curve.</p>${ask('c5oth','Before clicking: compared with 95%, will z* for 90% be bigger or smaller? And for 99%? Why?','Higher confidence needs a wider middle, so a <b>bigger z*</b>. 90% gives a smaller z* (1.645), 99% a bigger one (2.576).')}${ans(`C = ${pctTxt(C)}: z* = ${f3(z)}`,`tail area = (1 &minus; ${C}) / 2 = ${pctF(t)}`)}<p class="note">TI-84: ${cd(`invNorm(${pctF(1-t)})`)} = ${f3(z)}</p>`; },
   viz:()=>{ const C=zs.level, t=(1-C)/2, z=Z[C];
     return {cap:`Critical value for ${pctTxt(C)} confidence`,tail:'standard normal curve',body:normSVG({h:230,shades:[{a:-z,b:z,cls:'mid',label:pctTxt(C),lx:0,ly:100,big:true},{a:-4,b:-z,cls:'tail',label:pctF(t),lx:(-z-4)/2},{a:z,b:4,cls:'tail',label:pctF(t),lx:(z+4)/2}],marks:[{x:-z,label:'−'+f3(z)},{x:z,label:f3(z)}]})+zTabHTML(-z,zInvCells(t)),
       ctl:`<span class="lab">Confidence</span>`+seg('zlevel','level',[[0.9,'90%'],[0.95,'95%'],[0.99,'99%']],zs.level)}; }},
  {cap:'Estimate the SE',
   html:()=>{ const c=ci.single; return `<p>The SE formula needs p, but p is exactly what we do not know.</p>${ask('c5se','What can we plug in for p instead?',`Our best guess, ${PH}:${eq(raw`SE=\sqrt{\frac{\hat p(1-\hat p)}{n}}=\sqrt{\frac{${f2(c.ph)}(${f2(1-c.ph)})}{${c.n}}}=${f4(c.se)}`)}`)}`; },
   viz:()=>({cap:'One poll, true p unknown',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,false,true),ctl:newBtn})},
  {cap:'Margin of error',
   html:()=>{ const c=ci.single, z=Z[0.95]; return `<p>Wiggle room = critical value &times; standard error. We call it the ${tag('margin of error')}.</p>${ask('c5me',`Compute ME = z* &middot; SE with z* = ${f3(z)} and SE = ${f4(c.se)}.`,eq(raw`ME=z^*\cdot SE=${f3(z)}(${f4(c.se)})=${f4(c.me)}`))}`; },
   viz:()=>({cap:'One poll, true p unknown',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,false,!rv.c5ci),ctl:newBtn})},
  {cap:'The interval',
   html:()=>{ const c=ci.single; return `${ask('c5ci',`Build the confidence interval: ${PH} &plusmn; ME.`,`${eq(raw`CI=\hat p\pm ME=${f2(c.ph)}\pm${f4(c.me)}=(${f3(c.lo)},\ ${f3(c.hi)})`)}`)}${rem(`Plausible values for p: from <b>${f3(c.lo)}</b> to <b>${f3(c.hi)}</b>.`)}`; },
   viz:()=>({cap:'95% confidence interval',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,false,!rv.c5ci),ctl:newBtn})},
  {cap:'On the calculator',
   html:()=>{ const c=ci.single; return `<p>You will not do this by hand on an exam.</p>${ask('c5ti','Which calculator menu builds this interval, and which numbers do you enter?',`TI-84: STAT &rarr; TESTS &rarr; A:1-PropZInt.<br>x = ${c.k}, n = ${c.n}, C-Level = 0.95. The output matches: (${f3(c.lo)}, ${f3(c.hi)}).`)}`; },
   viz:()=>({cap:'95% confidence interval',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,false),ctl:newBtn})},
  {cap:'Did we capture p?',
   html:()=>{ const c=ci.single, t=ci.tally;
     return `<p>This poll gave the interval (${f3(c.lo)}, ${f3(c.hi)}).</p>${ask('c5cap','Predict: does this interval contain the true p? Then reveal.',`The true p is <b>0.54</b>. This interval ${c.hit?`<b style="color:var(--ok)">captures</b>`:`<b style="color:var(--acc)">misses</b>`} it.`)}`+(rv.c5cap?`<p>Click <b>New poll</b> a bunch of times.</p>${ans(`${t.hit} of ${t.n} captured p`,t.n?`${(t.hit/t.n*100).toFixed(0)}% so far; the method promises ${'95%'} in the long run`:'')}`:''); },
   viz:()=>({cap:rv.c5cap?'Reveal':'One poll, true p unknown',tail:`n = ${ci.single.n}`,body:singleSVG(ci.single,!!rv.c5cap),ctl:newBtn+(rv.c5cap?`<span class="sp"></span><div class="readout"><span>captured: <b>${ci.tally.hit} / ${ci.tally.n}</b></span></div>`:'')})},
  {cap:'Why does it work?',
   html:()=>{ const c=ci.single; return `<p>The 95% came from distances <i>around p</i>. Our interval is built <i>around ${PH}</i>.</p>${ask('c5flip',`Compare the two rows. If ${PH} is within one ME of p, is p within one ME of ${PH}?`,`Yes: <b>distance is symmetric</b>. The two rows always agree: both say YES or both say NO. So 95% of polls with ${PH} within 1.96 SEs of p are exactly the 95% of intervals that capture p.`)}${note('Click <b>New poll</b> to try other samples.')}`; },
   viz:()=>({cap:'Same distance, two directions',tail:`ME = ${f4(ci.single.me)}`,body:flipSVG(ci.single),ctl:newBtn})},
  {cap:'Check for understanding', check:true,
   html:()=>{ const c=mkCI(232,400), z9=Z[0.9], z99=Z[0.99], me9=z9*c.se, me99=z99*c.se;
     return `${checkIntro}<p class="note">A new poll of <b>400</b> voters finds <b>232</b> who will vote ${Bl}.</p>${qa('c5q1',1,`Build the 95% confidence interval for p.`,`${eq(raw`\hat p=\frac{232}{400}=${f2(c.ph)},\quad SE=\sqrt{\frac{${f2(c.ph)}(${f2(1-c.ph)})}{400}}=${f4(c.se)}`)}${eq(raw`ME=1.96(${f4(c.se)})=${f4(c.me)}\ \Rightarrow\ (${f3(c.lo)},\ ${f3(c.hi)})`)}`)}${qa('c5q2',2,`Now build the 90% and the 99% intervals from the same poll. Which is widest, and why?`,`90%: z* = ${f3(z9)}, ME = ${f4(me9)}, (${f3(c.ph-me9)}, ${f3(c.ph+me9)}).<br>99%: z* = ${f3(z99)}, ME = ${f4(me99)}, (${f3(c.ph-me99)}, ${f3(c.ph+me99)}).<br>The 99% interval is widest: more confidence needs a bigger z*.`)}${qa('c5q3',3,`Does this interval give evidence that ${Bl} is ahead (p &gt; 0.50)?`,`Yes. Every value in (${f3(c.lo)}, ${f3(c.hi)}) is above 0.50, so 0.50 is not a plausible value for p.`)}`; },
   viz:()=>{ const c=mkCI(232,400); return {cap:'The new poll',tail:'n = 400',body:singleSVG(c,false,!rv.c5q1)}; }}
 ]},
 {num:'06',name:'Reading Intervals',steps:[
  {cap:'100 pollsters',
   forest:()=>!!rv.c6pred,
   html:()=>`<p>Now 100 pollsters each take their own poll of ${ci.n} and build their own 95% interval. Each row will be one pollster&rsquo;s interval.</p>${ask('c6pred','How many of the 100 intervals do you expect to <b>miss</b> p?','About <b>5</b> out of 100. That is what 95% confidence promises.')}`,
   viz:()=>forestViz(rv.c6pred?`<button class="btn primary" data-act="forest">New set of 100 polls</button>`:'')},
  {cap:'Count the misses',
   forest:true,
   html:()=>{ const r=ci.run, hit=r.filter(c=>c.hit).length;
     return `<p><span class="tag">Gold</span> rows missed p.</p>${ans(`${hit} of ${r.length} captured p`,`${pctTxt(ci.level)} confidence`)}${ask('c6var','Click <b>New set of 100 polls</b> a few times. Is the number of misses always exactly 5?','No. It hovers around 5 but varies. The 95% describes the <i>long run</i>, not any single set.')}`; },
   viz:()=>forestViz(`<button class="btn primary" data-act="forest">New set of 100 polls</button>`)},
  {cap:'What 95% means',
   forest:true,
   html:()=>`<p>Suppose one pollster reports the interval (0.45, 0.63).</p>${ask('c6int','Is it correct to say &ldquo;there is a 95% probability that p is between 0.45 and 0.63&rdquo;? Why or why not?',`No. p is a <b>fixed</b> number, so it either is in the interval or is not. The 95% describes the <i>method</i>: about 95% of intervals built this way capture p.${rem(`We are ${pctTxt(ci.level)} confident that the true population proportion is within the interval obtained.`)}`)}`,
   viz:()=>forestViz(`<button class="btn primary" data-act="forest">New set of 100 polls</button>`)},
  {cap:'What changes the width?',
   forest:true,
   html:()=>`<p>The intervals are not all the same width.</p>${ask('c6w1','Two knobs: the confidence level and the poll size. Which direction makes intervals wider? Predict both.','Hold that thought. We will test each knob.')}`,
   viz:()=>forestViz('')},
  {cap:'Knob 1: confidence',
   forest:true,
   html:()=>`<p>Drag the <b>confidence</b> slider. The same 100 polls stay put; only the widths are recalculated.</p>${ask('c6wc','As confidence goes from 80% to 99%, what happens to the width? To the number of misses?','<b>Higher confidence, wider interval</b> (bigger z*), and <b>fewer misses</b>. The price of confidence is width.')}${widthStats()}`,
   viz:()=>forestViz(sliderC())},
  {cap:'Knob 2: poll size',
   forest:true,
   html:()=>`<p>Now drag the <b>poll size</b> slider.</p>${ask('c6wn','As n grows, what happens to the width? Does the number of misses change?','<b>Larger n, narrower interval</b> (smaller SE). The miss rate stays about the same, because the confidence level did not change.')}${widthStats()}`,
   viz:()=>forestViz(sliderN())},
  {cap:'The trade-off',
   forest:true,
   html:()=>`<p>Use both sliders.</p>${ask('c6tr','A pollster wants an interval that is both <b>narrow</b> and <b>highly confident</b>. What is the only way to get both?','Poll more voters. Raising confidence widens the interval; a larger n narrows it. A bigger sample is the only way to win on both fronts.')}${widthStats()}`,
   viz:()=>forestViz(sliderC()+sliderN())},
  {cap:'Check for understanding', check:true,
   forest:true,
   html:()=>`${checkIntro}${qa('c6q1',1,`A poll reports a 95% confidence interval of (0.48, 0.58) for the proportion who will vote ${Bl}. Write a correct interpretation.`,`We are 95% confident that the true proportion of all voters who will vote ${Bl} is between 0.48 and 0.58.`)}${qa('c6q2',2,`True or false: &ldquo;There is a 95% chance that p is between 0.48 and 0.58.&rdquo;`,`<b>False.</b> p is fixed; the interval either contains it or not. The 95% refers to the method&rsquo;s long-run success rate.`)}${qa('c6q3',3,`Poll X uses 90% confidence, Poll Y uses 99%, same data. Which interval is wider? Which is more likely to capture p?`,`Poll Y&rsquo;s (99%) is wider and more likely to capture p. More confidence means a wider interval.`)}`,
   viz:()=>forestViz('')}
 ]},
 {num:'07',name:'Sample Size',steps:[
  {cap:'Planning ahead',
   html:()=>`<p>Before polling, the pollster picks a target margin of error, say ±3% at 95% confidence, and needs to know how many voters to ask.</p>${eq(raw`ME=z^*\sqrt{\frac{\hat p(1-\hat p)}{n}}`)}${ask('c7know','Which parts of this formula do we know <i>before</i> polling? Which do we get to choose?',`Known: z* = 1.96 (from the confidence level) and ME = 0.03 (our target). We choose <b>n</b>. The problem: ${PH} does not exist yet.`)}`,
   viz:()=>({cap:'Planning a poll',tail:'before any data',body:`<table class="sum"><tr><td>z*</td><td>${rv.c7know?'Known: 1.96 for 95%':'?'}</td></tr><tr><td>ME</td><td>${rv.c7know?'Known: our target, 0.03':'?'}</td></tr><tr><td>${tex('\\hat p')}</td><td>${rv.c7know?'Unknown: no poll yet':'?'}</td></tr><tr><td>n</td><td>${rv.c7know?'What we want to find':'?'}</td></tr></table>`})},
  {cap:'The worst case',
   html:()=>`<p>We need a stand-in for ${PH}. Look at how ${T('p(1-p)')} behaves as p changes.</p>${ask('c7pq','Which value of p makes p(1 &minus; p) the largest? Why is that the safe choice for planning?','p = <b>0.5</b>, where p(1 &minus; p) = 0.25. It makes the SE (and so the ME) as big as it can get, so a poll sized for 0.5 is good enough <i>whatever</i> p turns out to be.')}`,
   viz:()=>({cap:'The worst case',tail:'p(1 − p) peaks at 0.5',body:pqSVG(!!rv.c7pq)})},
  {cap:'Solve for n',
   html:()=>`<p>Use ${T('\\hat p=0.5')} and solve the margin-of-error formula for n.</p>${ask('c7alg',`Start from ${T('ME=z^*\\sqrt{0.25/n}')}. Get n by itself. (Hint: square both sides.)`,`${eq(raw`\begin{aligned}ME&=z^*\sqrt{\frac{0.25}{n}}\\ \left(\frac{ME}{z^*}\right)^2&=\frac{0.25}{n}\\ n&=\frac{z^{*2}(0.25)}{ME^2}\end{aligned}`)}`)}`,
   viz:()=>({cap:'The worst case',tail:'p(1 − p) peaks at 0.5',body:pqSVG(true)})},
  {cap:'Plug in',
   html:()=>{ const z=Z[0.95], me=0.03, rawN=z*z*0.25/(me*me); return `<p>Target: ±3% at 95% confidence.</p>${ask('c7calc','Compute n.',`${eq(raw`n=\frac{(${f3(z)})^2(0.25)}{(${me})^2}=${rawN.toFixed(1)}`)}${ans(`n = ${needN(0.95,0.03).toLocaleString()} voters`,'always round up')}<p class="note">Why up? Rounding down to ${Math.floor(rawN)} would leave the margin of error slightly <i>above</i> 3%.</p>`)}`; },
   viz:()=>{ const sv={l:ss.level,m:ss.me}; ss.level=0.95; ss.me=0.03; const v=nbarsViz(false); ss.level=sv.l; ss.me=sv.m; return v; }},
  {cap:'Explore',
   html:()=>{ const z=Z[ss.level], n=needN(ss.level,ss.me), rawN=z*z*0.25/(ss.me*ss.me);
     return `<p>Click a margin of error, or change the confidence level.</p>${eq(raw`n=\frac{z^{*2}(0.25)}{ME^2}=\frac{(${f3(z)})^2(0.25)}{(${ss.me})^2}=${rawN.toFixed(1)}`)}${ans(`n = ${n.toLocaleString()} voters`,'always round up')}${ask('c7half',`Compare the &plusmn;2% and &plusmn;1% rows. Halving the margin of error needs how many times as many voters?`,`${needN(ss.level,0.02).toLocaleString()} vs. ${needN(ss.level,0.01).toLocaleString()}: about <b>4 times</b> as many. ME depends on 1/&radic;n, so halving it costs 4&times; the voters.`)}`; },
   viz:()=>nbarsViz(true)},
  {cap:'Real polls',
   html:()=>`<p>National polls often survey about 1,000 voters and report &plusmn;3%.</p>${ask('c7real','Does that agree with what we just found? Why do pollsters rarely go for ±1%?',`Yes: ±3% at 95% needs ${needN(0.95,0.03).toLocaleString()} voters, close to 1,000. For ±1% they would need ${needN(0.95,0.01).toLocaleString()}, far too costly for little extra precision.`)}`,
   viz:()=>nbarsViz(true)},
  {cap:'Check for understanding', check:true,
   html:()=>{ const n400=1.96*Math.sqrt(0.25/400);
     return `${checkIntro}${qa('c7q1',1,`How many voters are needed for a margin of error of &plusmn;2% at 95% confidence?`,`${eq(raw`n=\frac{(1.96)^2(0.25)}{(0.02)^2}=${(Z[0.95]*Z[0.95]*0.25/0.0004).toFixed(1)}`)}Round up: <b>${needN(0.95,0.02).toLocaleString()}</b> voters.`)}${qa('c7q2',2,`What about &plusmn;5% at <b>99%</b> confidence?`,`${eq(raw`n=\frac{(${f3(Z[0.99])})^2(0.25)}{(0.05)^2}=${(Z[0.99]*Z[0.99]*0.25/0.0025).toFixed(1)}`)}Round up: <b>${needN(0.99,0.05)}</b> voters.`)}${qa('c7q3',3,`A pollster can only afford 400 voters. What margin of error can they promise at 95% confidence?`,`${eq(raw`ME=1.96\sqrt{\frac{0.25}{400}}=${f3(n400)}`)}About <b>&plusmn;${(n400*100).toFixed(1)}%</b>.`)}`; },
   viz:()=>nbarsViz(false)},
  {cap:'The whole story',
   html:()=>`<p>From 10,000 voters and one unknown number to a statement about how far off a poll is likely to be.</p>`,
   viz:()=>({cap:'Recap',tail:'Chapters 1 to 7',body:`<table class="sum">
     <tr><td>PARAMETER</td><td>${tex(raw`p=\frac{\text{Blue voters}}{\text{all voters}}`)} Fixed, unknown.</td></tr>
     <tr><td>STATISTIC</td><td>${tex(raw`\hat p=\frac{x}{n}`)} Changes poll to poll.</td></tr>
     <tr><td>SAMPLING DIST.</td><td>Center ${T('p')}, ${tex(raw`SE=\sqrt{\tfrac{p(1-p)}{n}}`)}, approximately normal.</td></tr>
     <tr><td>Z-SCORE</td><td>${tex(raw`z=\tfrac{x-\text{mean}}{SE}`)} Table gives the area to the left.</td></tr>
     <tr><td>PROBABILITY</td><td>normalcdf and invNorm on the normal model.</td></tr>
     <tr><td>CRITICAL VALUE</td><td>${tex(raw`z^*`)}: middle C of the standard normal. 1.645, 1.96, 2.576.</td></tr>
     <tr><td>CONFIDENCE INT.</td><td>${tex(raw`\hat p\pm z^*\sqrt{\tfrac{\hat p(1-\hat p)}{n}}`)}</td></tr>
     <tr><td>WIDTH</td><td>More confidence: wider. Larger n: narrower.</td></tr>
     <tr><td>SAMPLE SIZE</td><td>${tex(raw`n=\tfrac{z^{*2}(0.25)}{ME^2}`)} rounded up.</td></tr></table>`})}
 ]}
];
const steps=[]; chapters.forEach((c,ci_)=>c.steps.forEach((s,i)=>steps.push(Object.assign({ch:ci_,i},s))));

/* ---------- actions ---------- */
function refreshAfter(){ render(false); }
const actions={
  poll:()=>{ takePoll(); },
  sort:()=>{ st.sorted=!st.sorted; },
  add:v=>{ simAdd(sim,+v); },
  clearsim:()=>{ sim=mkSim(sim.n); },
  setn:v=>{ sim=mkSim(+v); simAdd(sim,3000); },
  dir:v=>{ prob.dir=v; },
  cut:v=>{ prob.c=Math.min(0.9,Math.max(0.2,Math.round((prob.c+ +v)*100)/100)); },
  pn:v=>{ prob.n=+v; },
  newci:()=>{ newSingle(); },
  forest:()=>{ newZs(); },
  sslevel:v=>{ ss.level=+v; },
  zlevel:v=>{ zs.level=+v; },
  me:v=>{ ss.me=+v; },
  reveal:v=>{ rv[v]=true; if(v==='c5cap'){ ci.tally.n++; if(ci.single.hit) ci.tally.hit++; } }
};

/* ---------- rendering ---------- */
function leftHTML(){
  const s=steps[st.g], ch=chapters[s.ch], cards=steps.filter(x=>x.ch===s.ch && x.i<=s.i);
  return cards.map((c,k)=>`<div class="ln${k===cards.length-1?' now':''}${c.check?' check':''}"><div class="cap">${ch.num} // ${c.cap}</div>${c.html()}</div>`).join('');
}
// sliders: update the story cards and the interval chart in place, so the slider being dragged is never rebuilt
function liveCI(){
  ci.run=forestRun(); $('#stage').classList.remove('anim');
  const l=$('#colL'), top=l.scrollTop;
  l.innerHTML=leftHTML(); l.scrollTop=top; $('#fbody').innerHTML=forestSVG();
  if($('#vC')) $('#vC').textContent=pctTxt(ci.level); if($('#vN')) $('#vN').textContent='n = '+ci.n; $('#vtail').textContent=`n = ${ci.n}, ${pctTxt(ci.level)}`;
}
function renderDots(){
  const s=steps[st.g];
  $('#dots').innerHTML=steps.map((x,i)=>x.ch===s.ch?`<button class="dot${x.check?' chk':''}" data-g="${i}" title="${x.cap}" aria-label="Step ${x.i+1}: ${x.cap}"></button>`:'').join('');
}
function render(anim){
  const s=steps[st.g], ch=chapters[s.ch];
  const oldL=$('#colL'), oldR=$('#colR'), oldS=$('#stage');
  const keep=(!anim && oldL)?{l:oldL.scrollTop,r:oldR?oldR.scrollTop:0,s:oldS.scrollTop,bottom:oldL.scrollHeight-oldL.scrollTop-oldL.clientHeight<60}:null;
  if(anim) steps.filter(x=>x.ch===s.ch && x.i<=s.i).forEach(x=>{ if(x.enter) x.enter(); });
  if(s.forest!==undefined) ci.run=(typeof s.forest==='function'?s.forest():s.forest)?forestRun():[];
  const left=leftHTML();
  const v=s.viz(); const fx=h=>(h||'').replace(/p&#770;/g,PH);
  v.cap=fx(v.cap); v.tail=fx(v.tail); v.ctl=fx(v.ctl); v.body=fx(v.body);
  $('#stage').className='stage'+(anim?' anim':'');
  $('#stage').innerHTML=`<div class="duo"><div class="col left" id="colL">${left}</div><div class="col right" id="colR"><section class="viz"><div class="vcap"><span>${v.cap}</span><span id="vtail">${v.tail||''}</span></div><div class="vbody">${v.body}</div>${v.ctl?`<div class="ctl">${v.ctl}</div>`:''}</section></div></div>`;
  const l=$('#colL'), r=$('#colR');
  if(anim){ l.scrollTop=l.scrollHeight; }
  else if(keep){ l.scrollTop=keep.bottom?l.scrollHeight:keep.l; r.scrollTop=keep.r; $('#stage').scrollTop=keep.s; }
  requestAnimationFrame(drawPop);
  // chrome
  [...document.querySelectorAll('.tab')].forEach((t,i)=>t.classList.toggle('on',i===s.ch));
  $('#slabel').textContent=`${ch.num} // ${ch.name} · step ${s.i+1} of ${ch.steps.length}`;
  renderDots();
  [...document.querySelectorAll('.dot')].forEach(d=>{ const i=+d.dataset.g; d.classList.toggle('cur',i===st.g); d.classList.toggle('past',i<st.g); });
  $('#prev').disabled=st.g===0; $('#next').disabled=st.g===steps.length-1;
}
function go(g){ st.g=Math.max(0,Math.min(steps.length-1,g)); render(true); }
function restart(){
  Object.keys(rv).forEach(k=>delete rv[k]);
  one={cur:null,first:null,hist:[]}; sim=mkSim(100); ci.single=null; ci.tally={n:0,hit:0}; ci.n=100; ci.level=0.95; ci.zs=null;
  ss.level=0.95; ss.me=0.03; zs.level=0.95; prob.dir='le'; prob.c=0.5; prob.n=100; st.sorted=false;
  go(0);
}

/* ---------- boot ---------- */
$('#tabs').innerHTML=chapters.map((c,i)=>`<button class="tab" data-ch="${i}"><b>${c.num}</b>${c.name}</button>`).join('');
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) go(steps.findIndex(s=>s.ch===+b.dataset.ch)); });
$('#dots').addEventListener('click',e=>{ const b=e.target.closest('.dot'); if(b) go(+b.dataset.g); });
$('#prev').addEventListener('click',()=>go(st.g-1));
$('#next').addEventListener('click',()=>go(st.g+1));
$('#stage').addEventListener('click',e=>{ if(e.target.id==='pop'&&view.mode==='truth'){ st.sorted=!st.sorted; render(false); return; } const b=e.target.closest('[data-act]'); if(!b) return; const a=actions[b.dataset.act]; if(a){ a(b.dataset.v); refreshAfter(); } });
$('#stage').addEventListener('input',e=>{ const t=e.target;
  if(t.id==='slC') ci.level=+t.value/100; else if(t.id==='slN') ci.n=posToN(+t.value); else return; liveCI(); });
$('#themeBtn').addEventListener('click',()=>{ st.theme=st.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=st.theme; $('#themeBtn').innerHTML=st.theme==='dark'?'&#9790;':'&#9728;'; render(false); });
document.addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight') go(st.g+1); else if(e.key==='ArrowLeft') go(st.g-1); else if(e.key==='r'||e.key==='R') restart(); });
window.addEventListener('resize',()=>requestAnimationFrame(drawPop));
go(0);
})();
</script>
</body>
</html>
