<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ben_sacks | Sampling Distributions &amp; Confidence Intervals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..900;1,8..60,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  /* site palette (matches assets/css/styles.css): charcoal + gold, Source Serif 4 + Space Mono */
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#1e1e1e; --panel:#232323; --ink:#e9e9e9; --muted:#a0a0a0; --line:#3d3d3d; --soft:#2c2c2c;
  --blue:#4a8cff; --red:#ff5a4f;
  --oat:#d79a58; --milk:#7f96b3; --cup:#4a4a4a;
  --acc:#e3b505; --accSoft:rgba(227,181,5,.38); --accHot:rgba(227,181,5,.22); --accInk:#f2cc3a; --onAcc:#1e1e1e;
  --ok:#3ddc84; --bad:#ff6b6b;
  --shadow:none;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f3f1ea; --panel:#ffffff; --ink:#1e1e1e; --muted:#5f5f5f; --line:#d6d3c8; --soft:#eceae1;
  --blue:#1565e0; --red:#d93025;
  --oat:#b8732f; --milk:#8ea6c4; --cup:#d9d5ca;
  --acc:#d9a800; --accSoft:rgba(217,168,0,.38); --accHot:rgba(217,168,0,.26); --accInk:#6b5200; --onAcc:#1e1e1e;
  --ok:#0b7f44; --bad:#c62828;
  --shadow:0 1px 2px rgba(20,25,40,.05),0 6px 18px rgba(20,25,40,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--serif);font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);
  font-size:clamp(15px,.8vw + 5px,21px);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}

/* top bar */
header.top{display:flex;align-items:center;gap:.6em;padding:.45em .9em;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;white-space:nowrap;font-size:1.02em;display:flex;align-items:center;gap:.4em}
.brand svg{width:1.3em;height:1.3em}
nav.tabs{display:flex;gap:.2em;overflow-x:auto;flex:1 1 300px;min-width:0;scrollbar-width:thin;padding:.1em 0}
.tab{border:0;background:transparent;padding:.35em .65em;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted);font-size:.8em;font-family:var(--mono)}
.tab b{font-weight:800;margin-right:.3em;opacity:.55}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--acc);color:var(--onAcc)}
.tab.on b{opacity:.7}
.tools{display:flex;align-items:center;gap:.4em;font-size:.82em}
.kbd{font-size:.72em;color:var(--muted);white-space:nowrap;font-family:var(--mono)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);padding:.36em .75em;cursor:pointer;font-weight:600;line-height:1.2;font-family:var(--mono);font-size:.82em}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.btn.primary{background:transparent;border-color:var(--acc);color:var(--acc)}
.btn.primary:hover:not(:disabled){background:var(--accHot)}
.btn.on,.btn.on:hover{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.rb:focus-visible,.dot:focus-visible,.key:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg .btn{border:0;border-right:1px solid var(--line)}
.seg .btn:last-child{border-right:0}

/* main layout: visual on the left, the lesson on the right (like the Probability Bag) */
main{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);min-height:0}
main.wide{grid-template-columns:minmax(0,1fr)}
main.wide #stage{display:none}
#stage{min-height:0;overflow:auto;padding:.8em .9em;border-right:1px solid var(--line);display:flex;flex-direction:column}
#panel{min-height:0;display:flex;flex-direction:column}
.pbody{flex:1;overflow:auto;padding:.9em 1.3em 1.2em}
.pbody p{margin:.5em 0}
main.wide .pbody{max-width:1100px;margin:0 auto;width:100%}
.shead{display:flex;align-items:baseline;gap:.6em;margin:.1em 0 .5em}
.shead h2{margin:0;font-size:1.45em;letter-spacing:-.015em;line-height:1.15}
.shead .num{font:700 .72em var(--mono);color:var(--accInk);white-space:nowrap}
.pnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6em;align-items:center;padding:.5em 1em;border-top:1px solid var(--line);background:var(--panel)}
.pnav .btn{font-size:.85em;padding:.5em 1em}
.dots{display:flex;gap:.35em;flex-wrap:wrap;justify-content:center}
.dot{width:.62em;height:.62em;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.past{background:var(--muted)}
.dot.cur{background:var(--acc);transform:scale(1.35)}

/* viz card */
.viz{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.vcap{padding:.45em .9em;border-bottom:1px solid var(--line);font:700 .74em var(--mono);letter-spacing:.03em;color:var(--accInk);display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap}
.vcap span:last-child{color:var(--muted)}
.vbody{padding:.8em .9em;min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:.6em;justify-content:center}
.ctl{display:flex;flex-wrap:wrap;gap:.4em .5em;align-items:center;padding:.55em .9em;border-top:1px solid var(--line)}
.lab{font:700 .7em var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sp{flex:1}
.sl{display:flex;align-items:center;gap:.5em;flex:1 1 14em;min-width:0}
.sl input{flex:1;min-width:6em;accent-color:var(--acc)}
.sl b{font:700 .8em var(--mono);min-width:5.5em;color:var(--accInk)}
.readout{font:700 .8em var(--mono);color:var(--ink);display:flex;flex-wrap:wrap;gap:.25em 1.2em;justify-content:center}
.readout b{color:var(--accInk)}
.readout .ok{color:var(--ok)} .readout .bad{color:var(--bad)}
.big{font:700 1.15em var(--mono);text-align:center}
.big b{color:var(--accInk)}
.cmd{font:700 .86em var(--mono);background:var(--soft);padding:.35em .7em;text-align:center;overflow-x:auto;white-space:nowrap}
.cmd b{color:var(--accInk)}

/* lesson text bits */
.eq{margin:.45em 0;padding:.3em .7em;background:var(--soft);overflow-x:auto;overflow-y:hidden}
.eq .katex-display{margin:.15em 0}
.katex{font-size:1.06em}
.note{color:var(--muted);font-size:.9em;margin:.4em 0}
.note b{color:var(--ink)}
.key-idea{border-left:4px solid var(--acc);background:var(--accHot);padding:.45em .8em;margin:.6em 0;font-weight:600}
.def{border:1px solid var(--line);background:var(--panel);padding:.45em .8em;margin:.55em 0;box-shadow:var(--shadow)}
.def b:first-child{color:var(--accInk)}
.aside{border:1px dashed var(--line);padding:.4em .75em;margin:.6em 0;font-size:.88em;color:var(--muted)}
.aside b{color:var(--ink)}
.aside .tag83{font:700 .75em var(--mono);color:var(--accInk);display:block;margin-bottom:.15em;text-transform:uppercase;letter-spacing:.05em}
.hlw{border-bottom:2px dotted var(--acc);cursor:help;transition:background .15s}
.hlw.hot{background:var(--accHot)}
.oat{color:var(--oat);font-weight:800}
.mlk{color:var(--milk);font-weight:800}
.line{display:flex;align-items:center;flex-wrap:wrap;gap:.4em;margin:.45em 0;font-size:1.08em}
.line .op{color:var(--muted);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:.15em;vertical-align:middle}
.fbar{height:2px;background:var(--ink);align-self:stretch;min-width:2.2em}
.k{display:inline-block;font:700 .78em var(--mono);border:1px solid var(--line);background:var(--soft);padding:0 .4em;white-space:nowrap}
table.mini{border-collapse:collapse;margin:.4em 0;font-size:.92em}
table.mini th,table.mini td{padding:.25em .7em;border-bottom:1px solid var(--line);text-align:left}
table.mini th{font:700 .72em var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table.mini td.c{text-align:center}
table.mini code{font:700 .85em var(--mono)}

/* reveal boxes (click a ? to see the value) */
.rb{border:2px dashed var(--line);background:var(--soft);padding:.05em .5em;min-width:2.2em;min-height:1.7em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.3em;font-weight:700;line-height:1.2;vertical-align:middle;color:var(--muted);transition:background .2s,border-color .2s}
.rb:hover{border-color:var(--acc)}
.rb.on{border-style:solid;border-color:var(--acc);background:var(--accHot);color:var(--ink)}
.rb.wide{display:flex;width:100%;justify-content:flex-start;text-align:left;padding:.4em .7em;font-weight:500}
.rb.wide:not(.on){font-weight:700;font-size:.85em}
.rb.wide.on{background:transparent;border-color:var(--line);display:block}
.rb .katex{font-size:1em}

/* sort game */
.sorter{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:.55em}
.sitem{border:1px solid var(--line);background:var(--bg);padding:.5em .7em;display:flex;flex-direction:column;gap:.45em}
.sitem .q{font-weight:600;font-size:1.05em}
.sitem .row{display:flex;gap:.35em;flex-wrap:wrap;align-items:center}
.sitem.right{border-color:var(--ok)}
.sitem.wrong{border-color:var(--bad)}
.verdict{font:700 .75em var(--mono)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

/* svg charts */
.chart{display:block;width:100%;height:auto;max-height:calc(100dvh - 230px)}
.chart .ax{stroke:var(--ink);stroke-width:1.4}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{font:700 12px var(--mono);fill:var(--muted);text-anchor:middle}
.chart .tz{font:700 11px var(--mono);fill:var(--accInk);text-anchor:middle}
.chart .at{font:700 12px var(--mono);fill:var(--muted);text-anchor:middle}
.chart .mk{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4}
.chart .ml{font:700 12px var(--mono);fill:var(--ink);text-anchor:middle}
.chart .ml.acc{fill:var(--accInk)}
.chart .bar{fill:var(--milk);opacity:.85}
.chart .bar.hot{fill:var(--acc);opacity:1}
.chart .bar.new{fill:var(--oat);opacity:1}
.chart .curve{fill:none;stroke:var(--ink);stroke-width:2.4}
.chart .area{fill:var(--accSoft);stroke:none}
.chart .band{fill:color-mix(in srgb,var(--blue) 20%,transparent);stroke:none}
.chart .bigl{font:800 17px var(--mono);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:5px}
.chart .handle{fill:var(--acc);stroke:var(--panel);stroke-width:3;cursor:ew-resize}
.chart [data-drag]{cursor:ew-resize}
.chart .ci{stroke:var(--acc);stroke-width:5;stroke-linecap:round}
.chart .cap{stroke:var(--acc);stroke-width:2.5}
.chart .pd{fill:var(--blue)}
.chart .hit{stroke:var(--muted);stroke-width:2}
.chart .miss{stroke:var(--bad);stroke-width:2.6}
.chart .pd.miss{fill:var(--bad)}
.chart .tp{fill:var(--acc);stroke:var(--accInk);stroke-width:1.5}
.chart .fish{fill:var(--accInk)}
.chart .pq{fill:none;stroke:var(--ink);stroke-width:2.4}
.chart [data-k].hot{filter:drop-shadow(0 0 4px var(--acc))}
.chart .sdbr{stroke:var(--muted);stroke-width:2.5;fill:none}
.chart .sdbr.hot{stroke:var(--acc);filter:none}
.chart .sdlab{fill:var(--muted)}
.chart .sdlab.hot{fill:var(--accInk);filter:none}
.chart .mk.hot{stroke:var(--acc);stroke-width:3.4;filter:none}
.btnrow{display:flex;gap:.4em;flex-wrap:wrap;margin:.3em 0 .8em}
.btnrow.r{justify-content:flex-end}
.shrinkin{animation:shrinkin .7s ease both}
@keyframes shrinkin{from{max-width:470px}to{max-width:300px}}
.fadein{animation:fadein .7s ease .25s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* cups */
.cal .cup{fill:var(--cup)}
.cal .cup.o{fill:var(--oat)}
.cal .cup.m{fill:var(--milk)}
.cal .dayf{fill:none;stroke:transparent;stroke-width:2.5}
.cal .day{cursor:pointer}
.cal .day:hover .dayf,.cal .day.sel .dayf{stroke:var(--muted)}
.cal .day.hot .dayf{stroke:var(--acc)}
.cal .dl{font:700 12px var(--mono);fill:var(--muted);text-anchor:middle}
.cal .dk{font:700 11px var(--mono);fill:var(--muted)}
.dayv .cup{fill:var(--cup);stroke:none}
.dayv .cup.o{fill:var(--oat)}
.dayv .cup.m{fill:var(--milk)}
.dayv .lid{fill:var(--muted);opacity:.55}
.dayv .cupf{fill:none;stroke:transparent;stroke-width:3}
.dayv .cupf.hot{stroke:var(--acc)}
.dayv.pour .c{animation:pour .25s ease both}
@keyframes pour{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.legend{display:flex;gap:1em;justify-content:center;font:700 .74em var(--mono);color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:.8em;height:.8em;margin-right:.4em;vertical-align:-.05em}
.chips{display:flex;flex-wrap:wrap;gap:.3em;justify-content:center}
.chip{font:700 .72em var(--mono);padding:.1em .5em;border:1px solid var(--line);color:var(--muted)}
.chip.last{border-color:var(--acc);color:var(--accInk);background:var(--accHot)}
.flexw{display:flex;flex-wrap:wrap;gap:.8em;align-items:center;justify-content:center}
.flexw>*{min-width:0}

/* TI-84 Plus CE */
.calcgrid{display:grid;grid-template-columns:minmax(0,17.5em) minmax(0,1fr);gap:1em;align-items:start}
.ti{background:#1b1b1b;border:1px solid #444;border-radius:1.2em 1.2em 2.2em 2.2em;padding:.9em .8em 1.1em;container-type:inline-size;width:100%;max-width:17.5em}
.ti-scr{background:#fbfbf8;color:#111;aspect-ratio:4/3;border:.35em solid #0b0b0b;border-radius:.3em;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;display:flex;flex-direction:column}
.ti-hdr{display:flex;justify-content:space-between;align-items:center;font-size:3.6cqw;font-weight:700;color:#555;padding:.35em .5em .2em;border-bottom:1px solid #ddd;letter-spacing:.02em}
.ti-hdr i{display:inline-block;width:1.1em;height:1.6em;border:1.5px solid #3a9b38;background:linear-gradient(#fff 30%,#4cb04a 30%);border-radius:1px}
.ti-body{flex:1;padding:.2em .5em;font-size:4.6cqw;line-height:1.3;overflow:hidden}
.tl{white-space:pre-wrap;word-break:break-all;min-height:1.3em}
.tl.r{text-align:right}
.tl.c{text-align:center}
.inv{background:#111;color:#fff;padding:0 .12em}
.ti-scr .cur{display:inline-block;width:.55em;height:1em;background:#111;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
.ti-scr .cur.up{background:#111;color:#fff;font-size:.8em;width:auto;padding:0 .1em;line-height:1.2}
.ti-scr .cur.up::before{content:'⇧'}
.ti-scr .cur.al{background:#111;color:#fff;font-size:.8em;width:auto;padding:0 .1em;line-height:1.2}
.ti-scr .cur.al::before{content:'A'}
.ti-scr .opt{padding:0 .12em}
.ti-scr .opt.pt{outline:1.5px solid #111;animation:blink 1s steps(1) infinite}
.ti-scr .typed{animation:typed .5s ease}
@keyframes typed{from{background:#ffe680}to{background:transparent}}
@keyframes blink{50%{opacity:.25}}
.ti-scr input{border:0;border-bottom:1px dashed #999;background:transparent;color:#111;font:inherit;width:9.5em;padding:0;outline:none}
.ti-scr input:focus{border-bottom:1.5px solid #111;background:#fff6c9}
.ti-scr .tsel{cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:.15em .45em;margin-top:.8em;font-size:3.6cqw}
.kc{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.kl{display:flex;justify-content:space-between;font-weight:700;font-size:.92em;line-height:1.15;min-height:1.2em;white-space:nowrap;font-family:Arial,Helvetica,sans-serif}
.kl .s2{color:#7cb8f2}
.kl .sa{color:#a6d33e}
.key{border:1px solid #555;background:#2e2e2e;color:#f3f3f3;border-radius:.5em;height:2.2em;cursor:pointer;font:700 1.1em Arial,Helvetica,sans-serif;padding:0;white-space:nowrap;overflow:hidden;transition:transform .1s}
.key.fn{height:1.7em;border-radius:1em;font-size:1em}
.key.num{background:#f0f0ee;color:#111;border-color:#bbb;font-size:1.4em;height:1.75em}
.key.op{background:#dcdcd8;color:#111;border-color:#aaa}
.key.second{background:#8ec2f5;color:#111;border-color:#8ec2f5}
.key.alpha{background:#9ccc3c;color:#111;border-color:#9ccc3c}
.key:active{transform:scale(.95)}
.key.glow{box-shadow:0 0 0 .22em var(--acc),0 0 1.1em .2em var(--acc);animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 .22em var(--acc),0 0 .3em 0 var(--acc)}}
.key.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dpad{grid-column:4/6;grid-row:2/4;position:relative;align-self:center;justify-self:center;width:6.6em;height:6.6em;margin-top:.6em}
.dpad .dp{position:absolute;width:2.3em;height:2.3em;border-radius:50%;background:#e6e6e3;border:1px solid #aaa;color:#111;padding:0;font-size:1em;cursor:pointer}
.dpad .dp.u{left:2.15em;top:0}.dpad .dp.d{left:2.15em;bottom:0}.dpad .dp.l{left:0;top:2.15em}.dpad .dp.r{right:0;top:2.15em}
.say{border:1px solid var(--line);background:var(--bg);padding:.6em .8em;min-height:6.5em}
.say .sn{font:700 .7em var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25em}
.say .btn{margin-top:.5em}
.calcside{display:flex;flex-direction:column;gap:.6em;min-width:0}
.calcside .row{display:flex;gap:.4em;flex-wrap:wrap}
.helpers{display:flex;gap:.3em;flex-wrap:wrap;margin-top:.5em;justify-content:center}
.helpers .btn{font-size:.72em;padding:.25em .55em}
.ksteps{margin:.4em 0;padding-left:1.5em}.ksteps li{margin:.45em 0}.ksteps .line{display:block;margin:.3em 0;font-family:var(--mono);font-size:.9em}
.pmodes{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;margin-bottom:.4em}

/* practice + summary */
.pq{border:1px solid var(--line);background:var(--panel);padding:.6em 1em .8em;margin:.9em 0;box-shadow:var(--shadow)}
.pq>p:first-child{margin-top:.2em}
.pq ol{margin:.3em 0;padding-left:1.5em}
.pq li{margin:.55em 0}
.pq li::marker{font-weight:800;color:var(--accInk)}
.sol{margin-top:.35em}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(19em,1fr));gap:.7em}
.sheet .def{margin:0}
.sheet .cmd{white-space:normal}
.sheet h3{margin:.1em 0 .35em;font-size:1em;color:var(--accInk);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;font-size:.78em}

@media (max-width:1150px){ .calcgrid{grid-template-columns:minmax(0,1fr)} .ti{margin:0 auto} }
@media (max-width:900px){
  .app{height:auto;min-height:100vh}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{border-right:0;border-bottom:1px solid var(--line);overflow:visible;padding:.6em}
  #panel{min-height:auto}
  .pbody{overflow:visible;padding:.8em 1em 1em}
  .pnav{position:sticky;bottom:0;z-index:5}
  .kbd{display:none}
  .chart{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const raw=String.raw;
function tex(s,d){ try{ return window.katex?katex.renderToString(s,{displayMode:!!d,throwOnError:false}):s; }catch(e){ return s; } }
const T=s=>tex(s), D=s=>`<div class="eq">${tex(s,true)}</div>`;
const PH=T('\\hat p');
const f2=x=>x.toFixed(2), f3=x=>x.toFixed(3), f4=x=>x.toFixed(4);
const pct=x=>(Math.round(x*1000)/10)+'%';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- normal distribution ---------- */
function Phi(z){
  if(z<-38) return 0; if(z>38) return 1;
  if(Math.abs(z)<5){ let s=z,v=z; for(let i=1;i<500;i++){ v*=z*z/(2*i+1); s+=v; if(Math.abs(v)<1e-17*Math.abs(s)) break; } return .5+s*Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
  const a=Math.abs(z); let f=0; for(let k=80;k>=1;k--) f=k/(a+f);
  const q=Math.exp(-a*a/2)/Math.sqrt(2*Math.PI)/(a+f); return z>0?1-q:q;
}
function invPhi(p){
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425; let q,r,x;
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else { q=p-0.5; r=q*q; x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  for(let i=0;i<2;i++){ const e=Phi(x)-p, u=e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2); x=x-u/(1+x*u/2); }
  return x;
}
const ncdf=(lo,hi,mu,sd)=>Phi((hi-mu)/sd)-Phi((lo-mu)/sd);
const inorm=(area,mu,sd)=>mu+sd*invPhi(area);
const zstar=C=>invPhi(1-(1-C)/2);
const sdOf=(p,n)=>Math.sqrt(p*(1-p)/n);

/* TI-84 style number: 10 significant digits, no leading zero */
function tiNum(x){
  if(!isFinite(x)) return 'ERR:DOMAIN'; if(Math.abs(x)<1e-12) return '0';
  const a=Math.abs(x); let s;
  if(a>=1e10||a<1e-3){ s=x.toExponential(9).replace(/\.?0+e/,'e').replace('e+','E').replace('e','E'); }
  else { const id=a<1?0:Math.floor(Math.log10(a))+1; s=x.toFixed(10-id); if(s.includes('.')) s=s.replace(/0+$/,'').replace(/\.$/,''); }   // 10 digits on screen, counting zeros after the point
  return s.replace(/^(-?)0\./,'$1.');
}
/* tiny calculator-expression parser: numbers, + - * / ^, parentheses, √( or sqrt(, E notation */
function evalExpr(src){
  const s=String(src).replace(/\s+/g,'').replace(/√/g,'sqrt').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−⁻]/g,'-').replace(/ᴇ/g,'E');
  if(!s) throw new Error('empty'); let i=0;
  const num=()=>{ const m=/^(\d+\.?\d*|\.\d+)(E-?\d+)?/i.exec(s.slice(i)); if(!m) throw new Error('syntax'); i+=m[0].length; return parseFloat(m[0].replace(/E/i,'e')); };
  const prim=()=>{ if(s.startsWith('sqrt(',i)){ i+=5; const v=expr(); if(s[i]===')') i++; return Math.sqrt(v); }
    if(s[i]==='('){ i++; const v=expr(); if(s[i]===')') i++; return v; } return num(); };
  const pw=()=>{ const b=prim(); if(s[i]==='^'){ i++; return Math.pow(b,un()); } return b; };
  const un=()=>{ if(s[i]==='-'){ i++; return -un(); } return pw(); };
  const term=()=>{ let v=un(); for(;;){ const c=s[i];
      if(c==='*'||c==='/'){ i++; const r=un(); v=c==='*'?v*r:v/r; }
      else if(c&&/[\d(.s]/.test(c)) v*=un(); else return v; } };
  const expr=()=>{ let v=term(); while(s[i]==='+'||s[i]==='-'){ const c=s[i++]; const r=term(); v=c==='+'?v+r:v-r; } return v; };
  const v=expr(); if(i!==s.length) throw new Error('syntax'); return v;
}

/* ---------- random ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function binom(n,p,r=Math.random){ let k=0; for(let i=0;i<n;i++) if(r()<p) k++; return k; }
const randn=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());

/* ---------- Mnemonic: last month = 20 weekdays x 150 milk drinks, 1,200 of them oat ---------- */
const P0=0.40, N0=150, SD0=sdOf(P0,N0);        // SD0 = 0.04 exactly
const DAYN=['Mon','Tue','Wed','Thu','Fri'];
const TUE=6;                                    // week 2, Tuesday: 54 oat drinks
const MONTH=(()=>{ const r=mulberry(6119), ks=[];
  for(let d=0;d<20;d++) ks.push(d===TUE?54:binom(N0,P0,r));
  let diff=1200-ks.reduce((a,b)=>a+b,0);
  while(diff!==0){ const d=Math.floor(r()*20); if(d===TUE) continue;
    if(diff>0&&ks[d]<72){ ks[d]++; diff--; } else if(diff<0&&ks[d]>48){ ks[d]--; diff++; } }
  return ks.map((k,d)=>{ const cups=new Uint8Array(N0); for(let i=0;i<k;i++) cups[i]=1;
    for(let i=N0-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=cups[i]; cups[i]=cups[j]; cups[j]=t; }
    return {k,cups,label:`Week ${Math.floor(d/5)+1} ${DAYN[d%5]}`}; }); })();
const dayLab=d=>MONTH[d].label;

/* ---------- simulated days (sampling distribution) ---------- */
function mkSim(n,p=P0){ return {n,p,c:new Uint32Array(n+1),tot:0,s:0,ss:0,last:null}; }
function simAdd(S,m){ for(let j=0;j<m;j++){ const k=binom(S.n,S.p); S.c[k]++; S.tot++; S.s+=k/S.n; S.ss+=(k/S.n)*(k/S.n); S.last=k; } }
const simMean=S=>S.s/S.tot, simSD=S=>Math.sqrt(Math.max(0,S.ss/S.tot-Math.pow(S.s/S.tot,2)));

/* ---------- the pistachio-latte survey (confidence intervals) ---------- */
const CX=58, CN=200, CPH=CX/CN, CSE=sdOf(CPH,CN), Z95=zstar(.95), CME=Z95*CSE;
const SECRET=0.31;                              // only the demo knows this

/* ---------- state ---------- */
const st={sec:0,step:0,theme:'dark',rev:{},hl:null,
  pick:TUE,picks:[],sort:{},
  today:null,hist:[],pour:false,
  nsl:150,
  cut:{mode:'gt',a:0.46,b:0.46,lo:0.35},
  inv:{tail:'RIGHT',area:0.05},
  calc:{id:null,i:0,typed:false},
  wig:0.02,flip:null,C:0.95,
  cap:{runs:[]},
  net:{z:null,C:0.95,n:200},
  alg:0,rup:1067,pg:0.5,
  ex:{C:0.95,me:0.03,p:0.5},
  play:{mode:'normalcdf',f:{lower:'',upper:'',mu:'',sigma:'',area:'',x:'',n:'',cl:''},tail:'LEFT',out:null},
  showAll:false};
let sim150=mkSim(150), simN=null, big=null;
function bigSim(){ if(!big){ big=mkSim(150); simAdd(big,2500); } return big; }
function simAtN(){ if(!simN||simN.n!==st.nsl){ simN=mkSim(st.nsl); simAdd(simN,2000); } return simN; }
function netZ(){ if(!st.net.z) st.net.z=Array.from({length:100},randn); return st.net.z; }

/* ---------- small html helpers ---------- */
const REG={};
function rb(id,ans,q='?',cls=''){ REG[id]={ans,q}; const on=!!st.rev[id]; return `<button class="rb ${cls}${on?' on':''}" data-rid="${id}" aria-label="Click to reveal">${on?ans:q}</button>`; }
const fr=(a,b)=>`<span class="frac">${a}<span class="fbar"></span>${b}</span>`;
const hl=(k,h)=>`<span class="hlw" data-hl="${k}">${h}</span>`;
const key=t=>`<span class="k">${t}</span>`;
const key2=()=>`<span class="k" style="background:#8ec2f5;border-color:#8ec2f5;color:#111">2nd</span>`;
const seg=(act,opts,cur)=>`<span class="seg">${opts.map(o=>`<button class="btn${String(o[0])===String(cur)?' on':''}" data-act="${act}" data-v="${o[0]}">${o[1]}</button>`).join('')}</span>`;
const slider=(id,min,max,stp,val,lab,out)=>`<label class="sl"><span class="lab">${lab}</span><input type="range" data-in="${id}" min="${min}" max="${max}" step="${stp}" value="${val}" aria-label="${lab}"><b data-out="${id}">${out}</b></label>`;
const older=h=>`<div class="aside"><span class="tag83">TI-83 / TI-84 Plus (not CE)</span>${h}</div>`;

/* ================================================================
   VISUALS
   ================================================================ */
const NS='http://www.w3.org/2000/svg';

/* ----- the month as a calendar of cups ----- */
function calendarSVG(o={}){
  const cs=5.4, gap=.9, dw=15*cs, dh=10*cs, gx=16, gy=26, L=58, Tp=26;
  const W=L+5*dw+4*gx+8, H=Tp+4*dh+3*gy+8;
  let s=`<svg class="chart cal" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last month: 20 weekdays of 150 drinks each">`;
  DAYN.forEach((n,c)=>{ s+=`<text class="dl" x="${L+c*(dw+gx)+dw/2}" y="${Tp-10}">${n}</text>`; });
  for(let w=0;w<4;w++) s+=`<text class="dk" x="4" y="${Tp+w*(dh+gy)+dh/2+4}">Wk ${w+1}</text>`;
  MONTH.forEach((day,d)=>{ const c=d%5, w=Math.floor(d/5), x0=L+c*(dw+gx), y0=Tp+w*(dh+gy);
    const sel=o.sel===d;
    s+=`<g class="day${sel?' sel':''}" data-k="pop day${d}${d===TUE?' tue':''}" data-act="${o.click?'pick':''}" data-v="${d}"><rect class="dayf" x="${x0-3}" y="${y0-3}" width="${dw+6}" height="${dh+6}"/>`;
    for(let i=0;i<N0;i++){ s+=`<rect class="cup ${day.cups[i]?'o':'m'}" x="${(x0+(i%15)*cs).toFixed(1)}" y="${(y0+Math.floor(i/15)*cs).toFixed(1)}" width="${cs-gap}" height="${cs-gap}"/>`; }
    s+=`<rect x="${x0-3}" y="${y0-3}" width="${dw+6}" height="${dh+6}" fill="transparent"/></g>`;
  });
  return s+'</svg>';
}
/* ----- the whole month as one 75 x 40 block, oat on the left ----- */
function popSVG(){
  const cs=8, gap=1.4, cols=75, rows=40, oat=Math.round(P0*cols*rows);
  let s=`<svg class="chart cal" viewBox="0 0 ${cols*cs+2} ${rows*cs+2}" role="img" aria-label="3,000 drinks: 1,200 oat on the left, 1,800 other on the right">`;
  for(let i=0;i<cols*rows;i++){ s+=`<rect class="cup ${i<oat?'o':'m'}" x="${(1+Math.floor(i/rows)*cs).toFixed(1)}" y="${(1+(i%rows)*cs).toFixed(1)}" width="${cs-gap}" height="${cs-gap}"/>`; }
  return s+'</svg>';
}
/* ----- one day: 150 cups ----- */
function cupsSVG(cups,o={}){
  const cw=26, chh=30, W=15*cw+8, H=10*chh+6;
  let s=`<svg class="chart dayv${o.pour?' pour':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="150 drinks" style="max-width:${o.max||520}px;margin:0 auto">`;
  if(o.k) s+=`<rect class="cupf" data-k="${o.k}" x="2" y="2" width="${W-4}" height="${H-4}"/>`;
  for(let i=0;i<N0;i++){ const x=4+(i%15)*cw+cw/2, y=4+Math.floor(i/15)*chh+chh/2, cls=cups?(cups[i]?'o':'m'):'';
    s+=`<g class="c" style="animation-delay:${o.pour?i*5:0}ms"><rect class="lid" x="${x-9}" y="${y-12}" width="18" height="3.6" rx="1.4"/><path class="cup ${cls}" d="M${x-8} ${y-8} H${x+8} L${x+6} ${y+12} H${x-6} Z"/></g>`; }
  return s+'</svg>';
}
const cupLegend=()=>`<div class="legend"><span><i style="background:var(--oat)"></i>oat milk</span><span><i style="background:var(--milk)"></i>other milk</span></div>`;

/* ----- histogram of p-hat values ----- */
function histSVG(S,o={}){
  const W=640,H=o.h||330,L=16,R=16,T=30,B=44, pw=W-L-R, ph=H-T-B, base=T+ph;
  const x0=o.x0!=null?o.x0:0.2, x1=o.x1!=null?o.x1:0.6, n=S.n, X=x=>L+(x-x0)/(x1-x0)*pw;
  const g=Math.max(1,Math.ceil(n*(x1-x0)/90)), bw=g/n, barPx=bw/(x1-x0)*pw;
  const bins=[]; for(let k=0;k<=n;k+=g){ let c=0; for(let j=k;j<k+g&&j<=n;j++) c+=S.c[j]; bins.push({x:(k+(Math.min(k+g-1,n)-k)/2)/n,k,c}); }
  const maxC=Math.max(1,...bins.map(b=>b.c));
  const mu=o.curve?o.curve.mu:0, sd=o.curve?o.curve.sd:1, dens=x=>Math.exp(-.5*Math.pow((x-mu)/sd,2))/(sd*Math.sqrt(2*Math.PI));
  const peak=o.curve&&S.tot?S.tot*bw*dens(mu):0;
  const u=Math.min(barPx*.95,ph*(o.sdbr?.76:.92)/Math.max(maxC,peak));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of daily sample proportions">`;
  const tk=o.tk||0.05;
  for(let x=Math.ceil(x0/tk-1e-9)*tk;x<=x1+1e-9;x+=tk) s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+17}">${f2(x)}</text>`;
  if(o.area&&o.curve){ const [a,b]=o.area, lo=Math.max(a,x0), hi=Math.min(b,x1); if(hi>lo){ let d=`M${X(lo)},${base}`;
    for(let i=0;i<=80;i++){ const x=lo+(hi-lo)*i/80; d+=`L${X(x)},${base-S.tot*bw*dens(x)*u}`; } s+=`<path class="area" d="${d}L${X(hi)},${base}Z"/>`; } }
  const last=S.last!=null?S.last/n:null;
  bins.forEach(b=>{ if(!b.c) return; const x=X(b.x)-barPx/2, w=Math.max(1,barPx-1.2); const hot=o.hot&&o.hot(b.x);
    const isNew=o.markLast&&last!=null&&Math.abs(b.x-last)<bw/2+1e-9;
    if(u>=5){ for(let j=0;j<b.c;j++){ const nw=isNew&&j===b.c-1; s+=`<rect class="bar${hot?' hot':''}${nw?' new':''}" x="${x+.6}" y="${base-(j+1)*u+.6}" width="${w}" height="${u-1.2}"/>`; } }
    else s+=`<rect class="bar${hot?' hot':''}${isNew?' new':''}" x="${x+.6}" y="${base-b.c*u}" width="${w}" height="${b.c*u}"/>`; });
  if(o.curve&&S.tot){ let d=''; for(let i=0;i<=160;i++){ const x=x0+(x1-x0)*i/160; d+=(i?'L':'M')+X(x).toFixed(1)+','+(base-S.tot*bw*dens(x)*u).toFixed(1); } s+=`<path class="curve" data-k="curve" d="${d}"/>`; }
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  if(o.sdbr&&S.tot>1){ const m=o.sdbr.mu, sdv=o.sdbr.sd, yb=T+8;
    [1,2].forEach(k=>{ const y=yb+(k-1)*16; s+=`<path class="sdbr" data-k="sd" d="M${X(m-k*sdv)} ${y+5} V${y} H${X(m+k*sdv)} V${y+5}"/><text class="ml sdlab" data-k="sd" x="${X(m+k*sdv)+6}" y="${y+4}" style="text-anchor:start">±${k}σ</text>`; }); }
  (o.marks||[]).forEach(m=>{ s+=`<line class="mk" ${m.k?`data-k="${m.k}"`:''} x1="${X(m.x)}" x2="${X(m.x)}" y1="${T-4}" y2="${base}"/><text class="ml${m.acc?' acc':''}" x="${X(m.x)}" y="${T-10}">${m.label}</text>`; });
  s+=`<text class="at" x="${W/2}" y="${H-5}">${o.axis||'p̂ = proportion of the day’s drinks made with oat milk'}</text></svg>`;
  return s;
}

/* ----- normal curve with shading, marks, optional z-row and drag handles ----- */
const CG={W:640,L:24,R:24};
function curveSVG(o){
  const W=CG.W,H=o.h||290,L=CG.L,R=CG.R,T=36,B=o.z?64:44, pw=W-L-R, ph=H-T-B, base=T+ph;
  const mu=o.mu,sd=o.sd,x0=o.x0,x1=o.x1, X=x=>L+(x-x0)/(x1-x0)*pw;
  const dens=x=>Math.exp(-.5*Math.pow((x-mu)/sd,2)), Y=x=>base-dens(x)*ph*.9;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||'Normal curve'}"${o.drag?` data-drag="${o.drag}" data-x0="${x0}" data-x1="${x1}"`:''}>`;
  const tk=o.tk||0.05, dec=o.dec!=null?o.dec:2;
  for(let x=Math.ceil(x0/tk-1e-9)*tk;x<=x1+1e-9;x+=tk) s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+17}">${x.toFixed(dec)}</text>`;
  if(o.z) for(let k=-3;k<=3;k++){ const x=mu+k*sd; if(x<x0||x>x1) continue; s+=`<text class="tz" x="${X(x)}" y="${base+36}">z=${k}</text>`; }
  (o.band?[o.band]:[]).forEach(([a,b])=>{ const lo=Math.max(a,x0),hi=Math.min(b,x1); let d=`M${X(lo)},${base}`; for(let i=0;i<=80;i++){ const x=lo+(hi-lo)*i/80; d+=`L${X(x)},${Y(x)}`; } s+=`<path class="band" d="${d}L${X(hi)},${base}Z"/>`; });
  (o.shade||[]).forEach(([a,b])=>{ const lo=Math.max(a,x0),hi=Math.min(b,x1); if(hi<=lo) return; let d=`M${X(lo)},${base}`;
    for(let i=0;i<=90;i++){ const x=lo+(hi-lo)*i/90; d+=`L${X(x).toFixed(1)},${Y(x).toFixed(1)}`; } s+=`<path class="area" d="${d}L${X(hi)},${base}Z"/>`; });
  let d=''; for(let i=0;i<=180;i++){ const x=x0+(x1-x0)*i/180; d+=(i?'L':'M')+X(x).toFixed(1)+','+Y(x).toFixed(1); }
  s+=`<path class="curve" data-k="curve" d="${d}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  (o.labels||[]).forEach(l=>{ const x=Math.min(x1-(x1-x0)*.06,Math.max(x0+(x1-x0)*.06,l.x)); s+=`<text class="bigl" x="${X(x)}" y="${l.y!=null?l.y:base-ph*.32}">${l.t}</text>`; });
  (o.marks||[]).forEach(m=>{ if(m.x<x0||m.x>x1) return; s+=`<line class="mk" ${m.k?`data-k="${m.k}"`:''} x1="${X(m.x)}" x2="${X(m.x)}" y1="${T-4}" y2="${base}"/><text class="ml${m.acc?' acc':''}" x="${X(m.x)}" y="${T-11}">${m.label}</text>`;
    if(m.h) s+=`<circle class="handle" data-h="${m.h}" cx="${X(m.x)}" cy="${base}" r="10"/>`; });
  s+=`<text class="at" x="${W/2}" y="${H-5}">${o.axis||'p̂'}</text></svg>`;
  return s;
}

/* ----- number line for one interval ----- */
function nlineSVG(o){
  const W=640,H=o.h||190,L=24,R=24,base=H-46, x0=o.x0!=null?o.x0:0.1, x1=o.x1!=null?o.x1:0.5, X=x=>L+(x-x0)/(x1-x0)*(W-L-R), y=base-62;

  for(let x=x0;x<=x1+1e-9;x+=0.05) s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="18" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+17}">${f2(x)}</text>`;
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  if(o.secret) s+=`<line class="mk" x1="${X(o.secret)}" x2="${X(o.secret)}" y1="22" y2="${base}"/>${fish(X(o.secret),18)}<text class="ml acc" x="${X(o.secret)+16}" y="22" style="text-anchor:start">true p</text>`;
  else if(o.unknown) s+=`<text class="ml" x="${W-R}" y="20" style="text-anchor:end;fill:var(--muted)">true p = ? (we can’t see it)</text>`;
  if(o.se){ [-2,-1,1,2].forEach(k=>{ const x=o.ph+k*o.se; s+=`<line class="mk" data-k="se" x1="${X(x)}" x2="${X(x)}" y1="${y-20}" y2="${y+20}" style="stroke:var(--accInk)"/><text class="tz" x="${X(x)}" y="${y+36}">${k>0?'+':'−'}${Math.abs(k)} SE</text>`; }); }
  if(o.lo!=null){ s+=`<line class="ci" data-k="ci" x1="${X(o.lo)}" x2="${X(o.hi)}" y1="${y}" y2="${y}"/><line class="cap" x1="${X(o.lo)}" x2="${X(o.lo)}" y1="${y-14}" y2="${y+14}"/><line class="cap" x1="${X(o.hi)}" x2="${X(o.hi)}" y1="${y-14}" y2="${y+14}"/>`;
    if(o.ends) s+=`<text class="ml acc" x="${X(o.lo)}" y="${y+34}">${f4(o.lo)}</text><text class="ml acc" x="${X(o.hi)}" y="${y+34}">${f4(o.hi)}</text>`;
    if(o.me) s+=`<text class="ml" x="${(X(o.ph)+X(o.hi))/2}" y="${y-14}">ME</text><text class="ml" x="${(X(o.ph)+X(o.lo))/2}" y="${y-14}">ME</text>`; }
  if(o.ph!=null) s+=`<circle class="pd" data-k="phat" cx="${X(o.ph)}" cy="${y}" r="8"/><text class="ml" x="${X(o.ph)}" y="${y-(o.me?30:16)}" style="fill:var(--blue)">p̂ = ${f2(o.ph)}</text>`;
  s+=`<text class="at" x="${W/2}" y="${H-5}">${o.axis||'proportion of all customers who would order a pistachio latte'}</text></svg>`;
  return s;
}

/* ----- the "flip": p-hat within ME of p  <=>  p within ME of p-hat ----- */
function flipSVG(c){
  const W=640,H=270,L=24,R=24,base=226,x0=0.1,x1=0.5,X=x=>L+(x-x0)/(x1-x0)*(W-L-R);
  const cls=c.hit?'hit':'miss', yA=96, yB=176, v=c.hit?'YES':'NO';
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="The same distance works in both directions">`;
  for(let x=x0;x<=x1+1e-9;x+=0.05) s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="30" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+17}">${f2(x)}</text>`;
  const band=(y,ctr)=>`<line class="${cls}" style="stroke-width:6;stroke-linecap:round" x1="${X(ctr-c.me)}" x2="${X(ctr+c.me)}" y1="${y}" y2="${y}"/><line class="cap" x1="${X(ctr-c.me)}" x2="${X(ctr-c.me)}" y1="${y-11}" y2="${y+11}"/><line class="cap" x1="${X(ctr+c.me)}" x2="${X(ctr+c.me)}" y1="${y-11}" y2="${y+11}"/>`;
  const pDot=y=>`${truept(X(SECRET),y+24)}<text class="ml acc" x="${X(SECRET)+14}" y="${y+28}" style="text-anchor:start">p</text>`;
  const hDot=y=>`<circle class="pd" cx="${X(c.ph)}" cy="${y}" r="7"/><text class="ml" x="${X(c.ph)}" y="${y-14}" style="fill:var(--blue)">p̂</text>`;
  s+=`<text class="ml" x="${L}" y="${yA-34}" style="text-anchor:start">1. Go 1.96σ out from the true p. Does that reach p̂?  ${v}</text>`+band(yA,SECRET)+pDot(yA)+hDot(yA);
  s+=`<text class="ml" x="${L}" y="${yB-34}" style="text-anchor:start">2. Go 1.96σ out from p̂. Does that reach the true p?  ${v}</text>`+band(yB,c.ph)+pDot(yB)+hDot(yB);
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/><text class="at" x="${W/2}" y="${H-5}">the gold dot is the true p (pretend we know it: ${SECRET})</text></svg>`;
  return s;
}

function mkInt(ph,n,C){ const se=sdOf(ph,n), me=zstar(C)*se; return {ph,se,me,lo:ph-me,hi:ph+me,hit:ph-me<=SECRET&&SECRET<=ph+me}; }
function forestSVG(runs,o={}){
  const W=640,rows=runs.length,rh=o.rh||4.4,top=34,H=top+Math.max(rows,o.minRows||0)*rh+44,L=24,R=24,base=H-40,x0=o.x0||0.1,x1=o.x1||0.5,X=x=>L+(Math.min(x1,Math.max(x0,x))-x0)/(x1-x0)*(W-L-R);

  for(let x=x0;x<=x1+1e-9;x+=0.05) s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${top}" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+17}">${f2(x)}</text>`;
  s+=`<line class="mk" x1="${X(SECRET)}" x2="${X(SECRET)}" y1="${top-6}" y2="${base}"/>${o.fish?fish(X(SECRET),top-16):truept(X(SECRET),top-16)}<text class="ml acc" x="${X(SECRET)+20}" y="${top-12}" style="text-anchor:start">true p = ${SECRET}</text>`;
  runs.forEach((c,i)=>{ const y=top+rh*(i+.5);
    s+=`<line class="${c.hit?'hit':'miss'}" style="stroke-width:${Math.max(1.4,rh*.55)}" x1="${X(c.lo)}" x2="${X(c.hi)}" y1="${y}" y2="${y}"/><circle class="pd${c.hit?'':' miss'}" cx="${X(c.ph)}" cy="${y}" r="${Math.max(1.6,rh*.42)}"/>`; });
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/><text class="at" x="${W/2}" y="${H-5}">${o.axis||'each row is one survey’s interval (newest on top)'}</text></svg>`;

/* sampling distribution strip for the capture demo */
function capCurveSVG(runs){
  const W=640,H=170,L=24,R=24,T=14,base=118,x0=0.1,x1=0.5,X=x=>L+(x-x0)/(x1-x0)*(W-L-R), sd=sdOf(SECRET,CN), z=Z95;
  const Y=x=>base-Math.exp(-.5*Math.pow((x-SECRET)/sd,2))*(base-T)*.9;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sampling distribution of p-hat with the middle 95% shaded">`;
  let d=`M${X(SECRET-z*sd)},${base}`; for(let i=0;i<=80;i++){ const x=SECRET-z*sd+2*z*sd*i/80; d+=`L${X(x)},${Y(x)}`; } s+=`<path class="band" d="${d}L${X(SECRET+z*sd)},${base}Z"/>`;
  let c=''; for(let i=0;i<=160;i++){ const x=x0+(x1-x0)*i/160; c+=(i?'L':'M')+X(x).toFixed(1)+','+Y(x).toFixed(1); }
  s+=`<path class="curve" d="${c}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  s+=`<text class="ml" x="${X(SECRET)}" y="${base-28}" style="fill:var(--blue)">middle 95%</text>`;
  runs.slice(0,400).forEach((r,i)=>{ const jy=base+10+((i*37)%23); s+=`<circle class="pd${r.hit?'':' miss'}" cx="${X(r.ph)}" cy="${jy}" r="${i===0?4.5:2.6}" style="opacity:${i===0?1:.75}"/>`; });
  return s+'</svg>';
}

/* ----- p(1-p) ----- */
function pqSVG(p){
  const W=640,H=270,L=50,R=20,T=26,B=46,pw=W-L-R,ph=H-T-B,base=T+ph,X=x=>L+x*pw,Y=v=>base-v/0.25*ph*.92;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="p-hat times one minus p-hat" data-drag="pg" data-x0="0" data-x1="1" data-l="${L}" data-r="${R}">`;
  [0,.25,.5,.75,1].forEach(x=>{ s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${base}"/><text class="tk" x="${X(x)}" y="${base+17}">${x}</text>`; });
  [0,.1,.2,.25].forEach(v=>{ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${L-8}" y="${Y(v)+4}" style="text-anchor:end">${v}</text>`; });
  let d=''; for(let i=0;i<=100;i++){ const x=i/100; d+=(i?'L':'M')+X(x)+','+Y(x*(1-x)); }
  s+=`<path class="pq" d="${d}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  s+=`<line class="mk" x1="${X(.5)}" x2="${X(.5)}" y1="${Y(.25)}" y2="${base}" style="opacity:.5"/>`;
  if(p!=null) s+=`<line class="mk" x1="${X(p)}" x2="${X(p)}" y1="${Y(p*(1-p))}" y2="${base}" style="stroke:var(--accInk)"/><circle class="handle" cx="${X(p)}" cy="${Y(p*(1-p))}" r="10"/><text class="ml acc" x="${X(p)}" y="${Y(p*(1-p))-16}">${f2(p)}(1 − ${f2(p)}) = ${f4(p*(1-p))}</text>`;
  s+=`<text class="at" x="${W/2+L/2}" y="${H-5}">your guess for p̂ (drag the dot)</text><text class="ml" x="${L}" y="${T-10}" style="text-anchor:start">p̂(1 − p̂)</text></svg>`;
  return s;
}

function runPlay(){
  const P=st.play, f=P.f, v=k=>{ try{ return evalExpr(f[k]); }catch(e){ throw new Error(`Check the “${k==='sigma'?'σ':k==='mu'?'μ':k==='cl'?'C-Level':k}” line.`); } };
  try{
    if(P.mode==='normalcdf'){ const lo=v('lower'),up=v('upper'),mu=v('mu'),sg=v('sigma'); if(!(sg>0)) throw new Error('σ must be positive.');
      const val=ncdf(lo,up,mu,sg), x0=mu-4*sg, x1=mu+4*sg;
      P.out={lines:[{t:`normalcdf(${f.lower},${f.upper},${f.mu},${f.sigma})`},{t:tiNum(val),r:1}],
        chart:curveSVG({mu,sd:sg,x0,x1,tk:niceTick(x1-x0),dec:tickDec(x1-x0),shade:[[Math.max(lo,x0-1),Math.min(up,x1+1)]],h:240,labels:[{t:f4(val),x:Math.min(Math.max((Math.max(lo,x0)+Math.min(up,x1))/2,x0),x1)}],axis:''})}; }
    else if(P.mode==='invNorm'){ const a=v('area'),mu=v('mu'),sg=v('sigma'); if(!(a>0&&a<1)) throw new Error('The area has to be between 0 and 1.'); if(!(sg>0)) throw new Error('σ must be positive.');
      const x0=mu-4*sg,x1=mu+4*sg, tk=niceTick(x1-x0), dc=tickDec(x1-x0);
      let out,shade,marks;
      if(P.tail==='CENTER'){ const lo=inorm((1-a)/2,mu,sg),hi=inorm(1-(1-a)/2,mu,sg); out=`{${tiNum(lo)} ${tiNum(hi)}}`; shade=[[lo,hi]]; marks=[{x:lo,label:f4(lo),acc:1},{x:hi,label:f4(hi),acc:1}]; }
      else { const c=inorm(P.tail==='LEFT'?a:1-a,mu,sg); out=tiNum(c); shade=[P.tail==='LEFT'?[x0-1,c]:[c,x1+1]]; marks=[{x:c,label:f4(c),acc:1}]; }
      P.out={lines:[{t:`invNorm(${f.area},${f.mu},${f.sigma}${P.tail==='LEFT'?'':','+P.tail})`},{t:out,r:1}],chart:curveSVG({mu,sd:sg,x0,x1,tk,dec:dc,shade,marks,h:240,axis:''})}; }
    else { const x=v('x'),n=v('n'),cl=v('cl'); if(!(n>0&&x>=0&&x<=n)) throw new Error('Need 0 ≤ x ≤ n.'); if(!(cl>0&&cl<1)) throw new Error('C-Level is a decimal like 0.95.');
      const ph=x/n, se=sdOf(ph,n), z=zstar(cl), lo=ph-z*se, hi=ph+z*se;
      P.out={lines:[{t:'1-PropZInt'},{t:` (${tiNum(lo)},${tiNum(hi)})`},{t:` p̂=${tiNum(ph)}`},{t:` n=${n}`}],chart:''}; }
  }catch(e){ P.out={err:e.message}; }
}
function niceTick(r){ const t=r/8, p=Math.pow(10,Math.floor(Math.log10(t))), m=t/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function tickDec(r){ return Math.max(0,-Math.floor(Math.log10(niceTick(r)))); }

  const bars=mes.map(m=>{ const v=Math.ceil(needN(e.C,m,e.p)-1e-9); return `<div style="display:grid;grid-template-columns:4.5em minmax(0,1fr) 5em;gap:.6em;align-items:center;font:700 .8em var(--mono)"><span>±${Math.round(m*100)}%</span><span style="background:var(--soft);height:1.1em"><span style="display:block;height:100%;width:${Math.max(.5,v/mx*100)}%;background:${Math.abs(m-e.me)<1e-9?'var(--acc)':'var(--milk)'}"></span></span><span style="text-align:right;color:var(--accInk)">${v.toLocaleString()}</span></div>`; }).join('');
  return {cap:'How many customers?',tail:`${Math.round(e.C*100)}% confidence · p̂ = ${f2(e.p)}`,
    body:D(raw`n=\frac{${f3(z)}^2(${f2(e.p)})(1-${f2(e.p)})}{${e.me}^2}=${n.toFixed(2)}`)+`<div class="big">round up → n = <b>${Math.ceil(n-1e-9).toLocaleString()}</b></div><div style="display:flex;flex-direction:column;gap:.35em;margin-top:.4em"><div class="lab">customers needed for each margin of error</div>${bars}</div>`,
    ctl:slider('exC',80,99,1,Math.round(e.C*100),'Confidence',Math.round(e.C*100)+'%')+slider('exM',1,10,1,Math.round(e.me*100),'Margin',`±${Math.round(e.me*100)}%`)+slider('exP',5,95,1,Math.round(e.p*100),'p̂ guess',f2(e.p))};
}

const SECS=[
 {tab:'Pop & Sample',t:'Population vs. sample',steps:[
  {t:'Meet Mnemonic',
   body:()=>`<p>Gia and Sarah run <b>Mnemonic</b>, a popular coffee shop in Bankers Hill, San Diego.</p>
     <p>Let’s say that on a typical weekday they sell <b>150 milk-based drinks</b>. Last month had 20 non-holiday weekdays, so that’s</p>

   viz:()=>({cap:'Last month at Mnemonic',tail:'3,000 drinks',body:popSVG()+cupLegend()})},

   viz:()=>{ const d=MONTH[st.pick]; return {cap:'Population: all 3,000 drinks',tail:`Sample: ${dayLab(st.pick)}`,

  {t:'Parameters and statistics',
   body:()=>`<p>A value we use to describe a <b>population</b> is called a <b>parameter</b>.</p>
     <p>A value that comes from a <b>sample</b> is called a <b>statistic</b>.</p>
     <div class="key-idea"><b>P</b>opulation ↔ <b>P</b>arameter &nbsp;·&nbsp; <b>S</b>ample ↔ <b>S</b>tatistic</div>

   viz:sortViz},
  {t:'p and p̂',
   body:()=>{ const d=MONTH[st.pick], dh='day'+st.pick; return `<p>For this lesson we only look at <b>proportions</b>.</p>
     <p>The ${hl('pop','<b>population proportion</b>')} ${T('p')} is a parameter. For all drinks last month:</p>
     <div class="line">${T('p')} <span class="op">=</span> ${fr(rb('pn','1,200','?'),rb('pd','3,000','?'))} <span class="op">=</span> ${rb('pr','0.40')}</div>
     <p>Let’s say on ${hl(dh,dayLab(st.pick))}, ${d.k} of the 150 drinks were oat. The <b>sample proportion</b> ${PH} (“p-hat”) is a statistic:</p>
     <div class="line">${PH} <span class="op">=</span> ${fr(rb('qn',String(d.k)),rb('qd','150'))} <span class="op">=</span> ${rb('qr',f2(d.k/150))}</div>
     <table class="mini"><thead><tr><th></th><th>describes</th><th>value</th></tr></thead><tbody>

       <tr><td>${PH}</td><td>${hl(dh,'one sample')} (statistic)</td><td>${st.rev.qr?f2(d.k/150):'?'}</td></tr></tbody></table>
     <p class="note">Click a different day on the calendar to change the sample.</p>`; },
   enter:()=>{ st.pick=TUE; },
   viz:()=>({cap:'p describes the month · p̂ describes one day',tail:`${dayLab(st.pick)}: ${MONTH[st.pick].k} of 150 oat`,
     body:`<div class="flexw"><div style="flex:2.2 1 380px">${calendarSVG({sel:st.pick,click:true})}</div><div style="flex:1 1 190px;max-width:260px">${cupsSVG(MONTH[st.pick].cups,{max:260,k:'day'+st.pick})}</div></div>`+cupLegend()})}
 ]},
 {tab:'Variability',t:'Sampling variability',steps:[

   viz:()=>({cap:'The sampling distribution of p̂',tail:`n = 150`,body:histSVG(sim150,{marks:[{x:P0,label:'p = 0.40'}]})+simReadout(sim150),ctl:`<span class="sp"></span><button class="btn" data-act="clearsim">Clear</button>`})},
  {t:'The center',

   body:()=>`<p>The ${hl('mu','middle of this bell curve')} is equal to the population proportion.</p>

   viz:()=>({cap:'The center',tail:`${sim150.tot.toLocaleString()} days`,body:histSVG(sim150,{marks:[{x:P0,label:'μ = p = 0.40',k:'mu',acc:1}]})+simReadout(sim150),ctl:addDays()})},
  {t:'The spread',
   enter:()=>{ if(sim150.tot<1000) simAdd(sim150,1000-sim150.tot); },
   body:()=>`<p>The ${hl('sd','spread')} of the bell curve is its standard deviation:</p>
     ${D(raw`\sigma_{\hat p}=\sqrt{\frac{p(1-p)}{n}}`)}
     <div class="line">${T(sigTxt)} <span class="op">=</span> ${T(N150)} <span class="op">=</span> ${rb('sd','0.04')}</div>
     <p>You may recall that standard deviation measures variability. Here, a typical day’s ${PH} lands about 0.04 from 0.40.</p>`,
   viz:()=>({cap:'The spread',tail:`σ = 0.04`,body:histSVG(sim150,{marks:[{x:P0,label:'0.40'}],sdbr:{mu:P0,sd:SD0}})+simReadout(sim150),ctl:addDays()})},
  {t:'Putting it together',
   enter:()=>{ if(sim150.tot<1000) simAdd(sim150,1000-sim150.tot); },
   body:()=>`<p>Together, we say the sampling distribution of ${PH} is approximately normal with</p>
     ${D(raw`\mu_{\hat p}=p \qquad \sigma_{\hat p}=\sqrt{\frac{p(1-p)}{n}}`)}
     <p>For Mnemonic: ${T(raw`\hat p \sim N(0.40,\ 0.04)`)}.</p>
     <div class="def"><b>When is the normal model OK?</b><br>
       Expect at least 10 of each kind:<br>
       ${T('np \\ge 10')}<br>${rb('c1','150(0.4) = 60 ✓')}<br>
       ${T('n(1-p) \\ge 10')}<br>${rb('c2','150(0.6) = 90 ✓')}<br><br>
       The sample is at most 10% of the population:<br>
       ${T('n \\le 10\\% \\text{ of } N')}<br>
       n = 150 and N = 150 × 750 = 112,500 <span class="note">(150 cups/day × 250 non-holiday weekdays/year × 3 years of operation)</span><br>
       ${rb('c3','150 ≤ 11,250 ✓')}</div>`,
   viz:()=>({cap:'A normal model for p̂',tail:'N(0.40, 0.04)',body:histSVG(sim150,{curve:{mu:P0,sd:SD0},marks:[{x:P0,label:'0.40'}]})+simReadout(sim150),ctl:addDays()})},
  {t:'Busy days vs. slow days',
   body:()=>{ const se=sdOf(P0,st.nsl); return `<p>The important thing to notice in ${T(sigTxt)} is that the sample size ${T('n')} is in the <b>denominator</b>.</p>
     <p>On a slow day, a handful of oat-loving customers can swing the percentage a lot. On a busy day, those quirks get diluted by everyone else, so ${PH} tends to land closer to 40%.</p>
     <div class="line">${T(sigTxt)} <span class="op">=</span> ${T(raw`\sqrt{\frac{0.4(0.6)}{${st.nsl}}}`)} <span class="op">=</span> <b data-out="nslse">${f4(se)}</b></div>
     <div class="key-idea">Bigger n → smaller ${T(sigTxt)} → ${PH} lands closer to ${T('p')}.</div>
     <p>Try n = 150 and then n = 600 (four times as many). The spread is cut in ${rb('half','half: 0.04 → 0.02')}.</p>`; },
   viz:()=>{ const S=simAtN(); return {cap:'Drinks per day',tail:`2,000 simulated days at n = ${st.nsl}`,
     body:histSVG(S,{x0:0,x1:0.8,tk:0.1,curve:{mu:P0,sd:sdOf(P0,st.nsl)},marks:[{x:P0,label:'0.40'}]})+simReadout(S),
     ctl:slider('nsl',0,1000,1,Math.round(1000*Math.log(st.nsl/25)/Math.log(40)),'Drinks per day','n = '+st.nsl)+`<button class="btn" data-act="nset" data-v="150">150</button><button class="btn" data-act="nset" data-v="600">600</button>`}; }}
 ]},
 {tab:'normalcdf',t:'Probabilities from a sampling distribution',steps:[

   enter:()=>{ st.cut.mode='gt'; st.cut.a=0.46; },
   body:()=>`<p>Since ${T(raw`\hat p \sim N(0.40,\ 0.04)`)}, we can find the probability of seeing a particular kind of day. For example: what’s the probability that <b>more than 46%</b> of tomorrow’s drinks are oat?</p>

  {t:'normalcdf',
   body:()=>`<p>On the calculator, areas under a normal curve come from</p>
     <div class="cmd">normalcdf(<b>lower</b>, <b>upper</b>, <b>μ</b>, <b>σ</b>)</div>

       <tr><td>${T(raw`P(\hat p < a)`)}</td><td class="c"><code>-999</code></td><td class="c"><code>a</code></td></tr>

  {t:'Practice: running out of oat milk',

      <li>What is the probability they run out of oat milk on a given day?<div class="sol">${rb('rm3',`They run out if more than 64 drinks are oat: ${T(raw`P(\hat p>0.4267)`)}.<br>normalcdf(64/150, 999, 0.4, ${SIG}) ≈ <b>0.2525</b>. They run out on about 1 day in 4!`,'Show solution','wide')}</div></li>

 ]},
 {tab:'invNorm',t:'Working backwards: from a probability to a cutoff',steps:[
  {t:'Flip the question',
   enter:()=>{ st.inv.tail='RIGHT'; st.inv.area=0.05; },
   body:()=>`<p>So far we’ve gone from a <b>value</b> of ${PH} to a <b>probability</b>.</p>
     <p>Now let’s go the other way. Gia doesn’t want to run out of oat milk on more than <b>5%</b> of days. She needs to know:</p>

   viz:()=>invViz(false)},
  {t:'invNorm and the tail',
   body:()=>`<p>The calculator goes from an area to a cutoff with</p>
     <div class="cmd">invNorm(<b>area</b>, <b>μ</b>, <b>σ</b>, <b>Tail</b>)</div>

  {t:'On the TI-84',

   body:()=>`<p>Let’s find the cutoff with 5% of days above it:</p>

      <li>Press ${key2()}, then ${key('vars')} (<b>distr</b>).</li>
      <li>Choose <b>3:invNorm(</b>.</li>
      <li>Fill in the lines:
        <div class="line">area: <code>0.05</code><br>μ: <code>0.4</code><br>σ: <code>${SIG}</code><br>Tail: <code>RIGHT</code></div></li>
      <li>Move down to <b>Paste</b> and press ${key('enter')}.</li>
      <li>Press ${key('enter')} again to calculate.</li>
     </ol>

     <div class="line">${rb('ct1','0.4658')} × 150 drinks <span class="op">=</span> ${rb('ct2','69.9 → 70 oat drinks')}</div>
     <div class="line">70 × 4 oz <span class="op">=</span> ${rb('ct3','280 oz')} <span class="op">÷</span> 32 oz <span class="op">=</span> ${rb('ct4','8.75 → 9 cartons')}</div>
     <p class="note">Round up: 8 cartons wouldn’t be enough.</p>`,
   viz:()=>playViz({nomodes:true,inv:true})},
  {t:'The middle 95%',
   enter:()=>{ resetPlay('invNorm'); st.inv.tail='CENTER'; st.inv.area=0.95; },
   body:()=>`<p>CENTER is handy for “typical” days. Where do the <b>middle 95%</b> of days fall?</p>
     <div class="line">invNorm(0.95, 0.4, ${T(N150)}, CENTER) <span class="op">=</span> ${rb('m95','{0.3216, 0.4784}')}</div>
     <p>On 95% of days, between ${rb('m95b','32.2% and 47.8%')} of drinks are oat (about 48 to 72 drinks).</p>
     <p>Both cutoffs are about 1.96 standard deviations from the center: ${T(raw`0.40 \pm 1.96(0.04)`)}. Remember that 1.96. It comes back in the next section.</p>
     ${older(`invNorm has no Tail option: it always uses the area to the <b>left</b>. For the middle 95%, leave 2.5% in each tail:<br><code>invNorm(0.025, 0.4, 0.04)</code> = 0.3216 and <code>invNorm(0.975, 0.4, 0.04)</code> = 0.4784.`)}`,
   viz:()=>playViz({nomodes:true,inv:true})},
  {t:'Practice',
   body:()=>`<p>Remember ${T(raw`\hat p\sim N(0.40,\ 0.04)`)}.</p>

      <li>Between what two values do the <b>middle 90%</b> of days’ ${PH} fall?<div class="sol">${rb('iv1',`invNorm(0.90, 0.4, ${SIG}, CENTER) ≈ <b>{0.3342, 0.4658}</b>`,'Show solution','wide')}</div></li>
      <li>The slowest <b>10%</b> of oat days fall below what proportion?<div class="sol">${rb('iv2',`invNorm(0.10, 0.4, ${SIG}, LEFT) ≈ <b>0.3487</b>, about 52 oat drinks.`,'Show solution','wide')}</div></li>
      <li>How many cartons should Gia stock to run out on only <b>1%</b> of days?<div class="sol">${rb('iv3',`invNorm(0.01, 0.4, ${SIG}, RIGHT) ≈ 0.4931. 0.4931 × 150 ≈ 74 drinks. 74 × 4 = 296 oz, and 296 ÷ 32 = 9.25 → <b>10 cartons</b>.`,'Show solution','wide')}</div></li>
     </ol></div>`,
   enter:()=>{ resetPlay('invNorm'); st.inv.tail='CENTER'; st.inv.area=0.9; },
   viz:()=>playViz({nomodes:true,inv:true})}
 ]},
 {tab:'CIs',t:'Confidence intervals',steps:[
  {t:'When p is unknown',
   body:()=>`<p>Everything so far assumed we knew ${T('p')}. In real life, the whole reason we take a sample is that we <b>don’t</b>.</p>
     <p>Gia and Sarah are thinking about adding a <b>pistachio latte</b>. They want to know what proportion of <i>all</i> their customers would order one.</p>
     <p>They ask a random sample of <b>${CN}</b> customers, and <b>${CX}</b> say yes.</p>
     <div class="line">${PH} <span class="op">=</span> ${fr(CX,CN)} <span class="op">=</span> ${rb('ph',f2(CPH))}</div>
     <p>That’s our best single guess for ${T('p')}, called a <b>point estimate</b>.</p>`,
   viz:()=>({cap:'One survey',tail:`n = ${CN}`,body:nlineSVG({ph:st.rev.ph?CPH:null,unknown:true})})},
  {t:'Wiggle room',
   body:()=>`<p>Would you bet that <i>exactly</i> 29% of all customers want a pistachio latte? Probably not. A different 200 customers would give a different ${PH}.</p>
     <p>So we add some wiggle room: ${PH} plus or minus something, say ±0.02, giving (0.27, 0.31). Drag the slider to change it.</p>
     <div class="key-idea">Our goal is to come up with a <b>process</b> for choosing the wiggle room, so we know how often the interval would capture the true proportion.</div>`,
   viz:()=>({cap:'Point estimate ± wiggle room',tail:`± ${f2(st.wig)}`,body:nlineSVG({ph:CPH,lo:CPH-st.wig,hi:CPH+st.wig,ends:true,unknown:true}),ctl:slider('wig',0,10,1,Math.round(st.wig*100),'Wiggle room','± '+f2(st.wig))})},

/* ---------- practice assignment ---------- */
function practiceHTML(){
  const s=(id,h)=>`<div class="sol">${rb(id,h,'Show solution','wide')}</div>`;
  const s1=sdOf(.35,250), q2=302/840, se2=sdOf(q2,840), z90=zstar(.9);
  return `<p>Same style as the homework, new contexts. Work each part with the calculator on the left, then check the solution.</p>
  <div class="row" style="display:flex;gap:.5em;margin:.4em 0"><button class="btn" data-act="allsol">${st.showAll?'Hide':'Show'} all solutions</button></div>
  <div class="pq"><p><b>1.</b> A city transit agency knows that <b>35%</b> of all riders on its Green Line trolley pay with a monthly pass. A fare inspector checks a random sample of <b>250</b> riders and finds that <b>80</b> of them are using a monthly pass.</p>
   <ol type="a">
    <li>Find the population proportion and the sample proportion.${s('q1a',`${T('p = 0.35')} (all riders). ${T(raw`\hat p = \frac{80}{250} = 0.32`)} (the 250 riders checked).`)}</li>
    <li>Describe the sampling distribution of the sample proportion for random samples of 250 riders. Check any conditions you need.${s('q1b',`Approximately normal with ${T(raw`\mu_{\hat p}=0.35`)} and ${T(raw`\sigma_{\hat p}=\sqrt{\frac{0.35(0.65)}{250}}=${f4(s1)}`)}.<br>Conditions: random sample ✓; np = 250(0.35) = 87.5 ≥ 10 and n(1 − p) = 162.5 ≥ 10 ✓; 250 riders is less than 10% of all Green Line riders ✓.`)}</li>
    <li>What is the probability that a random sample of 250 riders would find <b>more than 40%</b> using a monthly pass?${s('q1c',`normalcdf(0.40, 999, 0.35, √(0.35*0.65/250)) ≈ <b>${f4(ncdf(.4,999,.35,s1))}</b>`)}</li>
    <li>Between what two values would the middle 95% of sample proportions fall for samples of 250 riders?${s('q1d',`invNorm(0.95, 0.35, √(0.35*0.65/250), CENTER) ≈ <b>(${f4(inorm(.025,.35,s1))}, ${f4(inorm(.975,.35,s1))})</b>`)}</li>
   </ol></div>
  <div class="pq"><p><b>2.</b> A campus dining survey asked <b>840</b> randomly selected college students whether they regularly skip breakfast. <b>302</b> said yes.</p>
   <ol type="a">
    <li>Find the sample proportion of students who regularly skip breakfast.${s('q2a',`${T(raw`\hat p=\frac{302}{840}=${f4(q2)}`)}`)}</li>
    <li>Find the critical value for a 90% confidence interval.${s('q2b',`invNorm(0.90, 0, 1, CENTER) → ${T(raw`z^*=${f3(z90)}`)} (TI-83/84 Plus: invNorm(0.95)).`)}</li>
    <li>Find the standard error of the sample proportion.${s('q2c',`${T(raw`SE=\sqrt{\frac{${f4(q2)}(1-${f4(q2)})}{840}}=${f4(se2)}`)}`)}</li>
    <li>Construct a 90% confidence interval for the proportion of all college students who regularly skip breakfast.${s('q2d',`ME = ${f3(z90)} × ${f4(se2)} = ${f4(z90*se2)}. ${f4(q2)} ± ${f4(z90*se2)} = <b>(${f4(q2-z90*se2)}, ${f4(q2+z90*se2)})</b>. 1-PropZInt with x = 302, n = 840, C-Level = 0.9 gives the same.`)}</li>
    <li>Write a one-sentence interpretation of your interval.${s('q2e',`We are 90% confident that between ${pct(q2-z90*se2)} and ${pct(q2+z90*se2)} of all college students regularly skip breakfast.`)}</li>
    <li>Suppose 500 different research teams each surveyed their own random sample of students and built a 90% confidence interval. How many of those intervals would we predict to contain the true proportion?${s('q2f',`90% of 500 = <b>450</b> intervals.`)}</li>
   </ol></div>
  <div class="pq"><p><b>3.</b> A city council wants to estimate the proportion of residents who support building a new off-leash dog park. A small pilot survey found <b>61%</b> in favor.</p>
   <ol type="a">
    <li>How many residents should the council survey to estimate the proportion within <b>4 percentage points</b> with <b>95%</b> confidence?${s('q3a',`${T(raw`n=\frac{1.96^2(0.61)(0.39)}{0.04^2}=${needN(.95,.04,.61).toFixed(2)}`)} → round up: <b>${Math.ceil(needN(.95,.04,.61))}</b> residents.`)}</li>
    <li>How many would it need for <b>90%</b> confidence with the same margin of error? Explain why this differs from part (a).${s('q3b',`${T(raw`n=\frac{1.645^2(0.61)(0.39)}{0.04^2}=${needN(.9,.04,.61).toFixed(2)}`)} → <b>${Math.ceil(needN(.9,.04,.61))}</b>. Lower confidence means a smaller ${T('z^*')}, so the same margin of error takes fewer people.`)}</li>
    <li>Suppose there had been no pilot survey. How many residents would the council need for part (a)? Why is it more?${s('q3c',`Use ${T(raw`\hat p=0.5`)}: ${T(raw`n=\frac{1.96^2(0.5)(0.5)}{0.04^2}=${needN(.95,.04,.5).toFixed(2)}`)} → <b>${Math.ceil(needN(.95,.04,.5))}</b>. 0.5 makes ${T(raw`\hat p(1-\hat p)`)} as large as possible, which is the safe choice when you have no estimate.`)}</li>
   </ol></div>`;
}
function summaryHTML(){
  const c=(h,b)=>`<div class="def"><h3>${h}</h3>${b}</div>`;
  return `<div class="sheet">
   ${c('Parameter vs. statistic',`<p>${T('p')} = population proportion (a parameter). Fixed, usually unknown.</p><p>${T(raw`\hat p=\frac{x}{n}`)} = sample proportion (a statistic). Changes from sample to sample.</p>`)}
   ${c('Sampling distribution of p̂',`${D(raw`\hat p\sim N\left(p,\ \sqrt{\tfrac{p(1-p)}{n}}\right)`)}<p class="note">Conditions: random, ${T(raw`np\ge10`)} and ${T(raw`n(1-p)\ge10`)}, n ≤ 10% of population.</p>`)}
   ${c('Value → probability',`<div class="cmd">normalcdf(lower, upper, μ, σ)</div><p class="note">Use −999 or 999 for an open end.</p>`)}
   ${c('Probability → value',`<div class="cmd">invNorm(area, μ, σ, LEFT | CENTER | RIGHT)</div><p class="note">TI-83/84 Plus: area to the left only.</p>`)}
   ${c('Confidence interval',`${D(raw`\hat p\pm z^*\sqrt{\frac{\hat p(1-\hat p)}{n}}`)}<p class="note">z* = invNorm(C, 0, 1, CENTER) · 90%: 1.645 · 95%: 1.960 · 99%: 2.576<br>Calculator: STAT → TESTS → A:1-PropZInt</p>`)}
   ${c('Interpretation',`<p>“We are C% confident that between ___ and ___ of all [population] [have the trait].”</p><p class="note">C% of intervals built this way contain p.</p>`)}
   ${c('Width',`<p>Higher C → wider. Bigger n → narrower. 4× the n → half the width.</p>`)}
   ${c('Sample size',`${D(raw`n=\frac{(z^*)^2\,\hat p(1-\hat p)}{ME^2}`)}<p class="note">No estimate? Use p̂ = 0.5. Always round <b>up</b>.</p>`)}
  </div>`;
}

const FLAT=[]; SECS.forEach((S,si)=>S.steps.forEach((s,i)=>FLAT.push([si,i])));
const cur=()=>SECS[st.sec].steps[st.step];
function renderTabs(){
  $('#tabs').innerHTML=SECS.map((S,i)=>`<button class="tab${i===st.sec?' on':''}" data-tab="${i}"><b>${i+1}</b>${S.tab}</button>`).join('');
  const on=$('#tabs .tab.on'); on&&on.scrollIntoView({block:'nearest',inline:'nearest'});
}
function renderBody(){
  for(const k in REG) delete REG[k];
  const S=SECS[st.sec], s=cur(), pb=$('#pbody'), top=pb.scrollTop;
  const num=S.steps.length>1?`${st.sec+1}.${st.step+1}`:`${st.sec+1}`;
  pb.innerHTML=`<div class="shead"><span class="num">${num}</span><h2>${s.t.replace('p̂',PH)}</h2></div>${s.body()}`;
  pb.scrollTop=top;
}
function renderNav(){
  const S=SECS[st.sec], g=FLAT.findIndex(f=>f[0]===st.sec&&f[1]===st.step);
  $('#pnav').innerHTML=`<button class="btn" data-act="prev"${g?'':' disabled'}>← Back</button>
    <div class="dots">${S.steps.length>1?S.steps.map((x,i)=>`<button class="dot${i===st.step?' cur':i<st.step?' past':''}" data-step="${i}" title="${x.t}" aria-label="Step ${i+1}: ${x.t}"></button>`).join(''):''}</div>
    <button class="btn primary" data-act="next"${g<FLAT.length-1?'':' disabled'}>Next →</button>`;
}
let vizCache=null;
function renderViz(onlyBody){
  const s=cur(); if(!s.viz){ $('#stage').innerHTML=''; return; }
  const v=s.viz(); vizCache=v;
  const fx=h=>(h||'').replace(/p̂/g,PH);
  if(onlyBody&&$('#vbody')){ $('#vbody').innerHTML=v.body; $('#vtail').innerHTML=fx(v.tail); $('#vcapt').innerHTML=fx(v.cap); }
  else {
    $('#stage').innerHTML=`<div class="viz"><div class="vcap"><span id="vcapt">${fx(v.cap)}</span><span id="vtail">${fx(v.tail)}</span></div><div class="vbody" id="vbody">${v.body}</div>${v.ctl?`<div class="ctl">${v.ctl}</div>`:''}</div>`;
  }
  applyHL();
  st.pour=false; st.anim=false;
}
function render(){
  $('#main').classList.toggle('wide',!!SECS[st.sec].wide);
  renderTabs(); renderBody(); renderNav(); renderViz();
}
function go(sec,step,fresh){
  st.anim=(sec===1&&step===1&&st.sec===1&&st.step===0);
  st.sec=sec; st.step=step; const s=cur(); st.hl=null;
  if(s.enter) s.enter();
  render(); if(fresh!==false){ $('#pbody').scrollTop=0; }
}
function goFlat(d){ const g=FLAT.findIndex(f=>f[0]===st.sec&&f[1]===st.step)+d; if(g<0||g>=FLAT.length) return; go(FLAT[g][0],FLAT[g][1]); }

/* ---------- hover links between the lesson text and the visual ---------- */
function applyHL(){
  const k=st.hl;
  $$('#stage [data-k]').forEach(n=>n.classList.toggle('hot',!!k&&n.dataset.k.split(' ').includes(k)));
  $$('#pbody [data-hl]').forEach(n=>n.classList.toggle('hot',!!k&&n.dataset.hl===k));
}
$('#pbody').addEventListener('pointerover',e=>{ const el=e.target.closest('[data-hl]'); const k=el?el.dataset.hl:null; if(k!==st.hl){ st.hl=k; applyHL(); } });
$('#pbody').addEventListener('pointerleave',()=>{ st.hl=null; applyHL(); });
$('#stage').addEventListener('pointerover',e=>{ const el=e.target.closest('.day'); if(!el){ return; } const m=/day(\d+)/.exec(el.dataset.k); if(m){ el.setAttribute('aria-label',dayLab(+m[1])); } });

/* ---------- actions ---------- */
const ACT={
  prev:()=>goFlat(-1), next:()=>goFlat(1),
  pick:v=>{ st.pick=+v; delete st.rev.qn; delete st.rev.qr; renderBody(); renderViz(); },
  sort:v=>{ const [i,a]=v.split(':'); st.sort[i]=a; renderViz(); },
  open:v=>{ openDay(Math.min(+v,25)); if(+v>25) simAdd(sim150,+v-25); st.pour=+v===1; if(+v>25){ st.today=st.today; } renderBody(); renderViz(); },
  clearsim:()=>{ sim150=mkSim(150); st.hist=[]; st.today=null; renderBody(); renderViz(); },
  nset:v=>{ st.nsl=+v; renderBody(); renderViz(); },
  cutmode:v=>{ st.cut.mode=v; if(v==='btw'){ st.cut.lo=0.35; st.cut.a=0.45; } else if(v==='lt'){ st.cut.a=0.35; } else st.cut.a=0.46; renderViz(); },
  tail:v=>{ st.inv.tail=v; renderViz(); },
  ctype:()=>{ st.calc.i++; renderViz(); },
  cnext:()=>{ st.calc.i++; renderViz(); },
  cprev:()=>{ st.calc.i=Math.max(0,st.calc.i-1); renderViz(); },
  creset:()=>{ st.calc.i=0; renderViz(); },
  flip:()=>{ newFlip(); renderViz(); },
  cap:v=>{ capAdd(+v); renderBody(); renderViz(); },
  capclear:()=>{ st.cap.runs=[]; capAdd(1); renderBody(); renderViz(); },
  newnet:()=>{ st.net.z=null; renderViz(); },
  alg:v=>{ st.alg=Math.max(0,Math.min(ALG.length-1,st.alg+ +v)); renderBody(); renderViz(); },
  rup:v=>{ st.rup=Math.max(1064,Math.min(1071,st.rup+ +v)); renderViz(); },
  pmode:v=>{ st.play.mode=v; st.play.out=null; renderViz(); },
  ptail:v=>{ st.play.tail=v; renderViz(); },
  pclear:()=>{ st.play.out=null; renderViz(); },
  prun:()=>{ runPlay(); renderViz(); },
  allsol:()=>{ st.showAll=!st.showAll; ['q1a','q1b','q1c','q1d','q2a','q2b','q2c','q2d','q2e','q2f','q3a','q3b','q3c'].forEach(k=>st.rev[k]=st.showAll); renderBody(); }
};
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('[data-tab]'); if(tab){ go(+tab.dataset.tab,0); return; }
  const dot=t.closest('[data-step]'); if(dot){ go(st.sec,+dot.dataset.step); return; }
  const r=t.closest('[data-rid]'); if(r){ const id=r.dataset.rid, R=REG[id]; if(!R) return; st.rev[id]=!st.rev[id];
    r.classList.toggle('on',!!st.rev[id]); r.innerHTML=st.rev[id]?R.ans:R.q;
    if(SECS[st.sec].steps.length&&/^(pr|qr|lo|hi|me)$/.test(id)) renderBody();
    renderViz(); return; }
  const k=t.closest('[data-key]'); if(k){ pressKey(k.dataset.key,k); return; }
  const ins=t.closest('[data-ins]'); if(ins){ const a=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.pf?document.activeElement:lastPF; if(a){ const p=a.selectionStart??a.value.length; a.value=a.value.slice(0,p)+ins.dataset.ins+a.value.slice(a.selectionEnd??p); st.play.f[a.dataset.pf]=a.value; a.focus(); const np=p+ins.dataset.ins.length; a.setSelectionRange(np,np); } return; }
  const a=t.closest('[data-act]'); if(a&&a.dataset.act&&ACT[a.dataset.act]){ ACT[a.dataset.act](a.dataset.v,a); }
});
let lastPF=null;
document.addEventListener('focusin',e=>{ if(e.target.dataset&&e.target.dataset.pf) lastPF=e.target; });
document.addEventListener('mousedown',e=>{ if(e.target.closest('[data-ins]')) e.preventDefault(); });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pf){ st.play.f[t.dataset.pf]=t.value; return; }
  const id=t.dataset.in; if(!id) return; const v=+t.value; let out='';
  switch(id){
    case 'nsl': st.nsl=Math.round(25*Math.pow(40,v/1000)); out='n = '+st.nsl; { const el=$('[data-out="nslse"]'); if(el) el.textContent=f4(sdOf(P0,st.nsl)); } break;
    case 'area': st.inv.area=v/100; out=f2(st.inv.area); break;
    case 'wig': st.wig=v/100; out='± '+f2(st.wig); break;
    case 'C': st.C=v/100; out=v+'%'; break;
    case 'netC': st.net.C=v/100; out=v+'%'; break;
    case 'netN': st.net.n=posToN(v); out='n = '+st.net.n; break;
    case 'exC': st.ex.C=v/100; out=v+'%'; break;
    case 'exM': st.ex.me=v/100; out='±'+v+'%'; break;
    case 'exP': st.ex.p=v/100; out=f2(st.ex.p); break;
  }
  const o=$(`[data-out="${id}"]`); if(o) o.textContent=out;
  renderViz(true);
});
document.addEventListener('change',e=>{ if(e.target.dataset.in==='nsl') renderBody(); });
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')){ if(e.key==='Enter'&&e.target.dataset.pf){ runPlay(); renderViz(); } return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){ goFlat(1); e.preventDefault(); } else if(e.key==='ArrowLeft'){ goFlat(-1); e.preventDefault(); }
});

/* ---------- dragging on charts ---------- */
let drag=null;
function svgX(svg,clientX){ const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=0; const m=svg.getScreenCTM(); return m?pt.matrixTransform(m.inverse()).x:0; }
function dragTo(clientX){
  const svg=$('#vbody svg[data-drag]'); if(!svg||!drag) return;
  const x0=+svg.dataset.x0, x1=+svg.dataset.x1, L=svg.dataset.l?+svg.dataset.l:CG.L, R=svg.dataset.r?+svg.dataset.r:CG.R, W=640;
  let v=x0+(svgX(svg,clientX)-L)/(W-L-R)*(x1-x0);
  if(drag.kind==='cut'){ v=Math.round(Math.min(x1,Math.max(x0,v))*200)/200; if(drag.h==='lo') st.cut.lo=v; else st.cut.a=v; }
  else if(drag.kind==='pg'){ st.pg=Math.round(Math.min(.99,Math.max(.01,v))*100)/100; }
  renderViz(true);
}
$('#stage').addEventListener('pointerdown',e=>{
  const svg=e.target.closest('svg[data-drag]'); if(!svg) return;
  const kind=svg.dataset.drag; let h='a';
  if(kind==='cut'&&st.cut.mode==='btw'){ const v=+svg.dataset.x0+(svgX(svg,e.clientX)-CG.L)/(640-CG.L-CG.R)*(+svg.dataset.x1-svg.dataset.x0); h=Math.abs(v-st.cut.lo)<Math.abs(v-st.cut.a)?'lo':'a'; }
  drag={kind,h}; e.preventDefault(); dragTo(e.clientX);
});
window.addEventListener('pointermove',e=>{ if(drag) dragTo(e.clientX); });
window.addEventListener('pointerup',()=>{ drag=null; });

/* ---------- theme ---------- */
$('#themeBtn').addEventListener('click',()=>{ st.theme=st.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=st.theme; $('#themeBtn').innerHTML=st.theme==='dark'?'&#9790;':'&#9728;'; });

go(0,0);
})();
</script>
</body>
